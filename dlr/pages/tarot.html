<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>:root{--cy:#7fe3f5;--gold:#eacb88;--mut:#a9c4d2;--line:rgba(127,227,245,.42)}

.ai{margin-top:16px;border-top:1px solid rgba(127,227,245,.2);padding-top:14px}

.fc.gone{opacity:0;pointer-events:none;transform:translateY(-34px)}

.fan.sh .fc{animation:shuf 1s ease-in-out}
.ph{aspect-ratio:2/3;border:1.5px dashed rgba(127,227,245,.4);border-radius:12px;display:grid;place-items:center;color:#8fd6e6;font:italic 400 15px 'Instrument Serif',serif}
.slot.in{animation:pop .5s cubic-bezier(.3,.8,.3,1)}@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.8)}to{opacity:1;transform:none}}
.cnt{text-align:center;color:var(--gold);font-size:13.5px;margin-top:12px}
.dia{display:flex;gap:16px;align-items:flex-start}.dia .slot{width:42%;flex:none}.dia .rd{margin:0;flex:1}

<div class="hero"><div class="eb">Oráculo</div><h1>Tarot <em>Desde la Red</em></h1><p class="lead">Respira, haz tu pregunta en silencio y deja que las cartas te hablen.</p></div>
<div class="tabs"><button class="tab on" data-m="dia">Carta del día</button><button class="tab" data-m="tres">Tirada de 3</button><button class="tab" data-m="celta">Cruz celta</button></div>
<div class="card" id="panel">
 <h2 id="ttl"></h2><p class="lead" id="sub" style="margin:0"></p>
 <div class="q" id="qbox"><input class="in" id="q" maxlength="140" placeholder="Tu pregunta (opcional)"></div>
 <div id="out"></div>
 <button class="btn" id="go"></button>
 <button class="btn ghost" id="again" hidden>Barajar de nuevo</button>
</div>
<p class="note">Las cartas son una guía para reflexionar, no una predicción. Las decisiones son tuyas.</p>
</main>
<script>
const MAY=[
['El Loco','Inicio y confianza','Un comienzo nuevo te llama. Da el paso con ligereza y curiosidad, aunque no tengas todo claro.','Imprudencia o miedo a empezar. Mira dónde vas antes de saltar, sin dejar de moverte.'],
['El Mago','Voluntad y recursos','Ya tienes lo que necesitas. Es momento de actuar y dar forma a tu idea.','Energía dispersa o dudas sobre tu valor. Elige una sola cosa y enfócate.'],
['La Sacerdotisa','Intuición y silencio','Escucha tu voz interior. La respuesta llega cuando haces silencio.','Ignoras lo que sientes. Vuelve a tu cuerpo y a tu calma.'],
['La Emperatriz','Abundancia y cuidado','Tiempo de crear, nutrir y recibir. Lo que cuidas florece.','Descuidas tus propias necesidades o te sobreexiges cuidando a otros.'],

['El Hierofante','Tradición y guía','Aprende de quien sabe y de lo que ya funcionó. Hay sabiduría en lo conocido.','Cuestiona reglas que ya no te sirven. Busca tu propia manera.'],
['Los Enamorados','Elección y unión','Una decisión del corazón. Elige según tus valores, con honestidad.','Desajuste entre lo que dices y lo que sientes. Revisa lo que de verdad quieres.'],
['El Carro','Dirección y avance','Avanzas con determinación. Si sostienes el rumbo, llegas.','Pierdes el rumbo o la fuerza se dispersa. Retoma las riendas.'],
['La Fuerza','Valor sereno','Tu fuerza es la calma y la ternura, no la presión.','Inseguridad o agotamiento. Recuerda tu valor y descansa.'],
['El Ermitaño','Búsqueda interior','Un tiempo a solas para ver con claridad. Lo que buscas está dentro.','Aislamiento excesivo. Permítete compartir lo que descubres.'],
['La Rueda de la Fortuna','Ciclos y cambio','Todo se mueve. Llega un giro; acompáñalo con confianza.','Resistencia al cambio. Soltar lo que ya terminó abre el siguiente ciclo.'],
['La Justicia','Equilibrio y verdad','Actúa con honestidad y observa las consecuencias. Se cosecha lo sembrado.','Evasión de responsabilidades. Mira los hechos tal como son.'],
['El Colgado','Pausa y otra mirada','Detente y cambia de perspectiva. La espera tiene un sentido.','Estancamiento por miedo a soltar. Decide qué estás dispuesta a dejar.'],

['La Templanza','Armonía y paciencia','Mezcla con medida. El equilibrio llega poco a poco.','Exceso o desajuste. Vuelve a tu ritmo.'],
['El Diablo','Ataduras y deseos','Mira qué te ata: hábitos, miedos, apegos. Verlo ya te libera.','Te sueltas de una atadura. Cuida no cambiarla por otra.'],
['La Torre','Ruptura que libera','Cae lo que no tenía base. Es sacudida, y también despeje.','Evitas un cambio necesario. Mejor derribar con consciencia que esperar el golpe.'],
['La Estrella','Esperanza y sanación','Calma después de la tormenta. Confía: te estás renovando.','Desánimo. Vuelve a lo pequeño que te da luz.'],
['La Luna','Misterio e intuición','No todo se ve con claridad. Atiende tus sueños y no decidas desde el miedo.','La niebla se despeja. Lo oculto sale a la luz.'],
['El Sol','Alegría y claridad','Vitalidad, éxito y verdad a plena luz. Disfruta lo logrado.','Alegría contenida o expectativas altas. El brillo sigue ahí.'],
['El Juicio','Llamado y renacer','Un llamado a ser más tú. Haz las paces con el pasado y avanza.','Duda o autocrítica. Perdónate para poder seguir.'],
['El Mundo','Plenitud y cierre','Un ciclo se completa. Celebra lo recorrido; ya estás lista para otro.','Falta un último paso. Termina lo pendiente con calma.']];
const PAL=['Fuego','Agua','Aire','Tierra'];
const SU=[
{n:'Bastos',el:'fuego',c:'#ffb86b',t:'Acción, impulso y creatividad'},
{n:'Copas',el:'agua',c:'#7fe3f5',t:'Emociones, vínculos y sensibilidad'},
{n:'Espadas',el:'aire',c:'#b9c8ff',t:'Mente, palabra y decisiones'},
{n:'Oros',el:'tierra',c:'#eacb88',t:'Cuerpo, trabajo y recursos'}];
const RK=['As','Dos','Tres','Cuatro','Cinco','Seis','Siete','Ocho','Nueve','Diez','Sota','Caballero','Reina','Rey'];
/* [palabra, derecha, invertida] por palo (Bastos, Copas, Espadas, Oros) y rango */
const MIN=[[
['Chispa','Nace una idea con mucha energía. Enciende el proyecto.','Ganas sin dirección. Falta combustible o claridad.'],
['Plan','Decides entre quedarte o expandirte. Planea con visión.','Miedo a salir de lo conocido. Tu plan necesita un primer paso.'],
['Horizonte','Tus planes empiezan a dar frutos. Mira lejos.','Retrasos. Revisa si el camino es el correcto.'],
['Celebración','Hogar, logro y alegría compartida. Hay base firme.','Inestabilidad o tensión en casa. Cuida los cimientos.'],
['Choque','Competencia y roces. Aprovecha el desacuerdo para afinar ideas.','Evitas el conflicto. Habla con claridad y tranquilidad.'],
['Victoria','Reconocimiento y logro. Tu esfuerzo se ve.','Dudas sobre tu éxito. No compares tu paso con el de otros.'],
['Defensa','Defiendes tu postura. Sostén lo tuyo con firmeza.','Te sientes abrumada. Pide apoyo.'],
['Movimiento','Todo se acelera. Llegan noticias y avances.','Prisa que desordena. Respira antes de actuar.'],

['Explorador','Noticia o idea nueva. Curiosidad y ganas de probar.','Entusiasmo sin constancia. Termina lo que empiezas.'],
['Aventura','Pasión y acción rápida. Cuida no dejarte llevar por el impulso.','Impaciencia. Frena un momento y elige tu rumbo.'],
['Carisma','Calidez, seguridad y magnetismo. Inspiras a otros.','Celos o inseguridad. Vuelve a confiar en tu luz.'],
['Visión','Liderazgo creativo. Convierte la visión en un plan real.','Autoritarismo o expectativas muy altas. Escucha más.']],
[
['Apertura','El corazón se abre: amor, intuición, un regalo emocional.','Emoción bloqueada. Permítete sentir.'],
['Unión','Conexión recíproca y respeto. Un vínculo equilibrado.','Desajuste en una relación. Habla desde el corazón.'],
['Alegría','Celebración con tus personas queridas. Disfruta.','Exceso o chisme. Cuida con quién compartes.'],

['Duelo','Pérdida y tristeza. Aún quedan copas en pie: mira lo que sí tienes.','Empiezas a sanar y a mirar adelante.'],
['Recuerdo','Nostalgia, infancia y ternura. Un recuerdo trae calma.','Vivir en el pasado. Regresa al presente.'],

['Deseo cumplido','Satisfacción y bienestar. Lo que pediste llega.','Satisfacción superficial. Pregúntate qué falta de verdad.'],
['Plenitud','Armonía en la familia y el corazón. Bienestar compartido.','Desajuste en el hogar. Conversa con ternura.'],
['Mensajero','Noticia afectuosa, creatividad e inspiración.','Inmadurez emocional o bloqueo creativo.'],
['Romántico','Propuesta, encanto y sensibilidad. Sigue tu corazón.','Promesas sin hechos. Mira la coherencia.'],
['Empatía','Compasión e intuición profunda. Cuida tu sensibilidad.','Te absorbes las emociones ajenas. Pon límites.'],
['Calma','Equilibrio emocional y sabiduría afectiva.','Reprimes lo que sientes. Exprésalo con calma.']],
[
['Claridad','Verdad que corta la confusión. Una idea nítida.','Mente nublada. Espera antes de decidir.'],
['Tregua','Decisión pendiente. Cerrar los ojos no la resuelve.','Sale a la luz lo que evitabas. Elige.'],
['Dolor','Tristeza o verdad dura que duele. Atraviésala con ternura.','Sanación. Dejas ir el dolor.'],
['Descanso','Pausa para recuperar la mente. Necesitas calma.','Inquietud. Vuelve a descansar de verdad.'],
['Conflicto','Una pelea que deja un costo. Elige tus batallas.','Reconciliación o cansancio de pelear.'],
['Travesía','Tránsito hacia aguas más tranquilas. Te alejas de lo difícil.','Resistencia a avanzar. Suelta el lastre.'],
['Estrategia','Ingenio y discreción. Cuida que no sea evasión.','Te sinceras. Dices la verdad.'],
['Bloqueo','Te sientes atrapada. La salida está en cambiar de mirada.','Te liberas. Encuentras una salida.'],
['Insomnio','Ansiedad y preocupaciones nocturnas. Habla de ello.','La angustia cede. Pide apoyo.'],
['Cierre','Un final doloroso que ya tocó fondo. Desde aquí se levanta.','Te niegas a soltar. Deja que termine.'],
['Observadora','Curiosidad, mente vivaz y deseo de saber.','Palabras hirientes o cotilleo. Piensa antes de hablar.'],
['Decisión','Acción directa y mente rápida. Cuida la prisa.','Impulsividad. Escucha antes de embestir.'],
['Lucidez','Honestidad y juicio claro. Experiencia que enseña.','Frialdad o dureza. Suaviza la verdad.'],
['Autoridad','Mente justa y firme. Decide con lógica y ética.','Abuso de poder o rigidez mental.']],
[
['Semilla','Oportunidad material: trabajo, salud, un nuevo comienzo.','Oportunidad perdida o mal planeada. Revisa los detalles.'],
['Equilibrio','Manejas varias cosas a la vez. Flexibilidad.','Desorden de tiempos o dinero. Prioriza.'],
['Oficio','Trabajo en equipo y maestría. Tu esfuerzo se nota.','Falta de coordinación. Pide y da claridad.'],
['Seguridad','Cuidas lo que tienes. Estabilidad, a veces con apego.','Aferrarte demasiado. Suelta un poco el control.'],
['Escasez','Dificultad económica o sensación de falta. Pide ayuda.','Mejora gradual. Vuelve la esperanza.'],
['Generosidad','Dar y recibir en equilibrio. Compartir.','Desequilibrio al dar o recibir. Cuida los acuerdos.'],
['Paciencia','Esperas el fruto de tu trabajo. Evalúa y sigue.','Impaciencia o esfuerzo mal enfocado.'],

['Legado','Prosperidad duradera, familia y raíces.','Tensiones familiares o económicas. Revisa acuerdos.'],

['Constancia','Trabajo firme y confiable. Avanza sin prisa.','Estancamiento o terquedad. Muévete un poco.'],
['Nutrición','Generosidad práctica, hogar y cuidado.','Descuido propio por cuidar a todos.'],
['Abundancia','Prosperidad estable y buen criterio con los recursos.','Materialismo o miedo a perder. Recuerda lo esencial.']]];

function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function shuffle(n){const a=DECK.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function seeded(s){return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}
/* Constelación propia por carta (respaldo si no hay imagen) */
function art(c){const r=seeded(c.id*7919+13),N=6+(c.id%5),P=[];for(let i=0;i<N;i++)P.push([30+r()*140,70+r()*180,.8+r()*2]);

const D=P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]*1.6}" fill="${c.col}"/><circle cx="${p[0]}" cy="${p[1]}" r="${p[2]*4}" fill="${c.col}" opacity=".12"/>`).join('');
return`<svg viewBox="0 0 200 300"><defs><radialGradient id="g${c.id}" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#1d5a82"/><stop offset="1" stop-color="#06162c"/></radialGradient></defs><rect width="200" height="300" fill="url(#g${c.id})"/><rect x="8" y="8" width="184" height="284" rx="8" fill="none" stroke="${c.col}" stroke-opacity=".55"/><g stroke="${c.col}" stroke-opacity=".5" stroke-width="1">${L}</g>${D}<text x="100" y="46" text-anchor="middle" fill="${c.col}" font-family="Instrument Serif,serif" font-size="26">${c.mark}</text><text x="100" y="282" text-anchor="middle" fill="#eef9ff" font-family="Instrument Serif,serif" font-size="15">${c.name}</text></svg>`}
function face(c){const d=document.createElement('div');d.className='face';d.innerHTML=art(c);const im=new Image();im.alt=c.name;im.onload=()=>{d.textContent='';d.append(im);const fl=d.closest('.fl');if(fl)fl.style.aspectRatio=im.naturalWidth+'/'+im.naturalHeight};im.src=IMG+String(c.id).padStart(2,'0')+'.webp';return d}
