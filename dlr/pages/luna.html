<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06162c"><title>Luna del día · Desde la Red</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>:root{--cy:#7fe3f5;--gold:#eacb88;--mut:#a9c4d2;--line:rgba(127,227,245,.42)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#1d4f7c 0%,#0a2140 42%,#050d1f 90%) fixed;color:#eef9ff;font:15px/1.5 'Albert Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:620px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 18px 60px}
.hero{text-align:center;padding:6px 0 10px}
.eb{font-size:11px;letter-spacing:.24em;color:#8fd6e6;text-transform:uppercase}
h1{font:400 clamp(34px,10vw,46px)/1.05 'Instrument Serif',Georgia,serif;margin:6px 0 4px}
h1 em{color:var(--cy);font-style:italic}
.lead{color:var(--mut);font-size:14px;margin:0 auto;max-width:420px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.tab{appearance:none;border:1px solid var(--line);background:rgba(6,22,44,.6);border-radius:14px;padding:10px 4px;font-size:13px;cursor:pointer;line-height:1.2}
.tab.on{background:rgba(127,227,245,.16);box-shadow:0 0 14px rgba(80,220,255,.35)}
.card{border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(21,76,104,.55),rgba(8,32,54,.75));box-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);padding:18px;margin-top:14px}
h2{font:400 24px/1.1 'Instrument Serif',serif;margin:0 0 6px;color:#f3e2b8}
.in{width:100%;border:1px solid var(--line);background:rgba(6,22,44,.6);border-radius:14px;padding:13px 14px;font-size:16px;outline:0;margin-top:10px}
.in:focus{box-shadow:0 0 14px rgba(80,220,255,.35)}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 16px;background:linear-gradient(135deg,#8ff0ff,#1fb5dc);color:#06162c;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 6px 18px rgba(40,200,240,.35);width:100%;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.n{appearance:none;border:1px solid var(--line);border-radius:16px;background:rgba(6,22,44,.55);padding:14px 4px;cursor:pointer;font:400 26px/1 'Instrument Serif',serif;color:#f3e2b8;letter-spacing:.04em}
.n.on{background:rgba(234,203,136,.16);border-color:rgba(234,203,136,.7);box-shadow:0 0 16px rgba(234,203,136,.3)}
.res{margin-top:16px;text-align:center;animation:pop .5s cubic-bezier(.3,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.big{font:400 76px/1 'Instrument Serif',serif;color:var(--gold);text-shadow:0 0 28px rgba(234,203,136,.55);letter-spacing:.06em}
.res h3{font:400 26px/1.1 'Instrument Serif',serif;color:#f3e2b8;margin:6px 0 2px}
.res .kw{color:var(--cy);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.res p{margin:10px 0 0;text-align:left;color:#dff1f7;font-size:14.5px;line-height:1.65}
.res .pr{border:1px solid rgba(234,203,136,.35);border-radius:16px;padding:12px 14px;background:rgba(234,203,136,.07);margin-top:14px;text-align:left;font-size:14px;color:var(--gold)}
.note{color:#8fa9b8;font-size:12px;text-align:center;margin:18px 6px 0}
[hidden]{display:none!important}

.btn.ghost{background:none;color:var(--cy);border:1px solid var(--line);box-shadow:none;font-weight:500}
.btn[disabled]{opacity:.7}
.cardimg{width:min(62%,230px);aspect-ratio:2/3;margin:6px auto 0;border-radius:14px;border:1px solid rgba(234,203,136,.55);box-shadow:0 10px 28px rgba(0,0,0,.55);overflow:hidden;background:radial-gradient(circle at 50% 40%,#1b5e86,#0a2140 70%);display:grid;place-items:center;font:400 22px/1.15 'Instrument Serif',serif;color:#f3e2b8;padding:10px;text-align:center}
.cardimg img{width:100%;height:100%;object-fit:cover;display:block}
.moon{width:170px;height:170px;margin:8px auto 0;border-radius:50%;box-shadow:0 0 50px rgba(234,203,136,.35)}
.moon svg{width:100%;height:100%;display:block}
.sub2{color:var(--mut);font-size:13px;text-align:center;margin-top:4px}
.tx{margin:12px 0 0;color:#dff1f7;font-size:14.5px;line-height:1.65}
.pr{border:1px solid rgba(234,203,136,.35);border-radius:16px;padding:12px 14px;background:rgba(234,203,136,.07);margin-top:14px;font-size:14px;color:var(--gold)}
.nx{display:flex;gap:10px;margin-top:14px;margin-bottom:12px}.nx div{flex:1;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:12.5px;color:var(--mut)}.nx b{display:block;font:400 18px 'Instrument Serif',serif;color:#f3e2b8}</style></head><body><canvas id="bg"></canvas><main>
<div class="hero"><div class="eb">Oráculo</div><h1>Luna <em>del día</em></h1><p class="lead">La fase de hoy y lo que te invita a hacer.</p></div>
<div class="card"><div class="moon" id="moon"></div><h2 id="ph" style="text-align:center;margin-top:12px"></h2><div class="sub2" id="il"></div><p class="tx" id="ms"></p><div class="pr" id="ri"></div><div class="nx"><div>Próxima luna nueva<b id="nn"></b></div><div>Próxima luna llena<b id="nf"></b></div></div><div id="gd"></div></div>
<p class="note">Fase calculada para tu fecha de hoy. Es una guía simbólica para reflexionar.</p>
</main>
<script>
const $=i=>document.getElementById(i);
function guardar(btn,texto){if(window.parent===window){btn.textContent='Ábrelo desde la app para guardar';return}parent.postMessage({dlr:'diario',texto:String(texto).slice(0,1800)},location.origin);btn.textContent='✓ Guardado en tu diario';btn.disabled=true}
function gbtn(texto){const b=document.createElement('button');b.className='btn ghost';b.textContent='♡ Guardar en mi diario';b.onclick=()=>guardar(b,texto);return b}
const SYN=29.530588853,REF=Date.UTC(2000,0,6,18,14);
function age(d){return(((d.getTime()-REF)/86400000)%SYN+SYN)%SYN}
const PH=[['Luna nueva','Es un momento de silencio y de sembrar. No necesitas tener todo claro: basta con una intención sencilla.','Escribe una intención para este mes y guárdala en un lugar visible.'],
['Luna creciente','Lo que sembraste empieza a moverse. Da un primer paso concreto, aunque sea pequeño.','Elige una acción de menos de diez minutos y hazla hoy.'],
['Cuarto creciente','Aparecen obstáculos y decisiones. Es hora de actuar con firmeza y ajustar el rumbo.','Resuelve hoy algo que has estado postergando.'],
['Gibosa creciente','Casi llegas. Afina los detalles y ten paciencia: el fruto está cerca.','Revisa tu avance y corrige un detalle.'],
['Luna llena','Todo se ve con claridad. Celebra lo logrado y suelta lo que ya no necesitas.','Anota tres cosas que agradeces y una que quieres soltar.'],
['Gibosa menguante','Es tiempo de compartir lo aprendido y de agradecer.','Cuéntale a alguien algo que aprendiste esta semana.'],
['Cuarto menguante','Toca soltar: hábitos, tareas o pensamientos que ya no suman.','Despeja un espacio: un cajón, un correo o una conversación pendiente.'],
['Luna menguante','Descanso y cierre. Recupera energía antes del nuevo ciclo.','Duerme temprano y tómate un momento de calma sin pantallas.']];
function idx(a){return Math.floor(((a/SYN)*8+0.5))%8}
function fmt(d){return d.toLocaleDateString('es',{day:'numeric',month:'short'})}
function nextAt(now,target){let a=age(now),t=target-a;if(t<=0.3)t+=SYN;return new Date(now.getTime()+t*86400000)}
function draw(a){const f=a/SYN,wax=f<.5,k=Math.cos(2*Math.PI*f),rx=Math.abs(k)*50;
 const d='M50 0A50 50 0 0 '+(wax?1:0)+' 50 100A'+rx.toFixed(2)+' 50 0 0 '+((wax?k<0:k>0)?1:0)+' 50 0Z';
 return '<svg viewBox="0 0 100 100"><defs><radialGradient id="mg" cx="40%" cy="38%" r="70%"><stop offset="0" stop-color="#fff6dc"/><stop offset="1" stop-color="#d9c18c"/></radialGradient></defs><circle cx="50" cy="50" r="50" fill="#0c2a4a" stroke="rgba(127,227,245,.45)" stroke-width=".8"/><path d="'+d+'" fill="url(#mg)"/></svg>'}
const now=new Date(),a=age(now),i=idx(a),ill=Math.round((1-Math.cos(2*Math.PI*a/SYN))/2*100);
$('moon').innerHTML=draw(a);$('ph').textContent=PH[i][0];$('il').textContent=ill+'% iluminada · '+fmt(now);$('ms').textContent=PH[i][1];$('ri').textContent='Para hoy: '+PH[i][2];
$('nn').textContent=fmt(nextAt(now,0));$('nf').textContent=fmt(nextAt(now,SYN/2));
$('gd').append(gbtn('Luna del día · '+PH[i][0]+'. '+PH[i][1]+' Para hoy: '+PH[i][2]));
(function(){const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,d,S=[],raf,last=0;const R=matchMedia('(prefers-reduced-motion: reduce)');
function rs(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);const n=Math.min(70,Math.max(24,W*H/16000|0));S=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.14,vy:(Math.random()-.5)*.14,r:.6+Math.random()*1,p:Math.random()*6.28}));dr(0)}
function dr(t){x.clearRect(0,0,W,H);const D=Math.min(140,Math.max(90,W*.17));for(let i=0;i<S.length;i++){const a=S[i];if(!R.matches){a.x=(a.x+a.vx+W)%W;a.y=(a.y+a.vy+H)%H}for(let j=i+1;j<S.length;j++){const b=S[j],q=Math.hypot(a.x-b.x,a.y-b.y);if(q<D){x.strokeStyle='rgba(115,222,239,'+(.2*(1-q/D)).toFixed(3)+')';x.lineWidth=.6;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}x.fillStyle='rgba(178,242,251,'+(.4+.25*Math.sin(t*.0007+a.p)).toFixed(3)+')';x.beginPath();x.arc(a.x,a.y,a.r,0,6.283);x.fill()}}
function f(t){if(t-last>30){dr(t);last=t}raf=requestAnimationFrame(f)}
addEventListener('resize',rs,{passive:true});rs();if(!R.matches)raf=requestAnimationFrame(f)})();

</script></body></html>
