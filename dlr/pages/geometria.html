<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06162c"><title>Geometría sagrada · Desde la Red</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>:root{--cy:#7fe3f5;--gold:#eacb88;--mut:#a9c4d2;--line:rgba(234,203,136,.38)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 15% 8%,rgba(98,60,170,.45) 0%,transparent 55%),radial-gradient(ellipse at 90% 30%,rgba(24,150,170,.30) 0%,transparent 55%),linear-gradient(#070b24,#0a1233 55%,#050816) fixed;color:#eef9ff;font:15px/1.5 'Albert Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:620px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 18px 60px}
.hero{position:relative;margin:calc(-14px - env(safe-area-inset-top)) -18px 0;height:250px;overflow:hidden;text-align:left;padding:0}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:68% 50%}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,11,36,.88) 0%,rgba(7,11,36,.35) 55%,transparent 100%),linear-gradient(0deg,#070b24 0%,transparent 38%)}.hero .tt{position:absolute;left:20px;bottom:28px;z-index:2;max-width:54%}.hero h1{font-size:clamp(28px,8.4vw,38px)}
.eb{font-size:11px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
h1{font:400 clamp(34px,10vw,46px)/1.05 'Instrument Serif',Georgia,serif;margin:6px 0 4px}
h1 em{color:var(--gold);font-style:italic}
.lead{color:#cfd6ea;font-size:14px;margin:0;max-width:420px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.tab{appearance:none;border:1px solid var(--line);background:rgba(6,22,44,.6);border-radius:14px;padding:10px 4px;font-size:13px;cursor:pointer;line-height:1.2}
.tab.on{background:rgba(127,227,245,.16);box-shadow:0 0 14px rgba(80,220,255,.35)}
.card{border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(52,36,110,.55),rgba(10,18,52,.82));backdrop-filter:blur(6px);box-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);padding:18px;margin-top:14px}
h2{font:400 24px/1.1 'Instrument Serif',serif;margin:0 0 6px;color:#f3e2b8}
.in{width:100%;border:1px solid var(--line);background:rgba(6,22,44,.6);border-radius:14px;padding:13px 14px;font-size:16px;outline:0;margin-top:10px}
.in:focus{box-shadow:0 0 14px rgba(80,220,255,.35)}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 16px;background:linear-gradient(135deg,#f6e3ae,#d9b45f);color:#1a1230;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 6px 18px rgba(234,203,136,.30);width:100%;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.n{appearance:none;border:1px solid var(--line);border-radius:16px;background:rgba(6,22,44,.55);padding:14px 4px;cursor:pointer;font:400 26px/1 'Instrument Serif',serif;color:#f3e2b8;letter-spacing:.04em}
.n.on{background:rgba(234,203,136,.16);border-color:rgba(234,203,136,.7);box-shadow:0 0 16px rgba(234,203,136,.3)}
.res{margin-top:16px;text-align:center;animation:pop .5s cubic-bezier(.3,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.big{font:400 76px/1 'Instrument Serif',serif;color:var(--gold);text-shadow:0 0 28px rgba(234,203,136,.55);letter-spacing:.06em}
.res h3{font:400 26px/1.1 'Instrument Serif',serif;color:#f3e2b8;margin:6px 0 2px}
.res .kw{color:var(--cy);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.res p{margin:10px 0 0;text-align:left;color:#dff1f7;font-size:14.5px;line-height:1.65}
.res .pr{border:1px solid rgba(234,203,136,.35);border-radius:16px;padding:12px 14px;background:rgba(234,203,136,.07);margin-top:14px;text-align:left;font-size:14px;color:var(--gold)}
.note{color:#8fa9b8;font-size:12px;text-align:center;margin:18px 6px 0}
[hidden]{display:none!important}

.btn.ghost{background:none;color:var(--gold);border:1px solid var(--line);box-shadow:none;font-weight:500}
.btn[disabled]{opacity:.7}
.cardimg{width:min(62%,230px);aspect-ratio:2/3;margin:6px auto 0;border-radius:14px;border:1px solid rgba(234,203,136,.55);box-shadow:0 10px 28px rgba(0,0,0,.55);overflow:hidden;background:radial-gradient(circle at 50% 40%,#1b5e86,#0a2140 70%);display:grid;place-items:center;font:400 22px/1.15 'Instrument Serif',serif;color:#f3e2b8;padding:10px;text-align:center}
.cardimg img{width:100%;height:100%;object-fit:cover;display:block}
.moon{position:relative;width:170px;height:170px;margin:26px auto 0;border-radius:50%;box-shadow:0 0 38px 8px rgba(255,236,170,.40),0 0 110px 30px rgba(234,203,136,.20)}.moon:before{content:'';position:absolute;inset:-18px;border-radius:50%;border:1px solid rgba(234,203,136,.55)}.moon:after{content:'✦';position:absolute;left:50%;top:-30px;transform:translateX(-50%);color:var(--gold);font-size:16px;text-shadow:0 0 10px rgba(234,203,136,.8)}
.moon svg{width:100%;height:100%;display:block}
.sub2{color:var(--mut);font-size:13px;text-align:center;margin-top:4px}
.tx{margin:12px 0 0;color:#dff1f7;font-size:14.5px;line-height:1.65}
.pr{border:1px solid rgba(234,203,136,.35);border-radius:16px;padding:12px 14px;background:rgba(234,203,136,.07);margin-top:14px;font-size:14px;color:var(--gold)}
.nx{display:flex;gap:10px;margin-top:14px;margin-bottom:12px}.nx div{flex:1;border:1px solid var(--line);background:rgba(234,203,136,.05);border-radius:14px;padding:10px;text-align:center;font-size:12.5px;color:var(--mut)}.nx b{display:block;font:400 18px 'Instrument Serif',serif;color:#f3e2b8}
.hero .tt{max-width:46%}.hero img{object-position:62% 50%}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.fb{appearance:none;border:1px solid var(--line);border-radius:16px;background:rgba(6,22,44,.55);padding:8px 4px 6px;cursor:pointer;color:#f3e2b8;font-size:11.5px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:4px}
.fb svg{width:100%;max-width:56px;height:auto}.fb.on{background:rgba(234,203,136,.16);border-color:rgba(234,203,136,.75);box-shadow:0 0 16px rgba(234,203,136,.3)}
.fig{width:min(78%,260px);aspect-ratio:1;margin:8px auto 0;position:relative}
.fig svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 7px rgba(234,203,136,.65))}
.fig svg *{fill:none;stroke:#f6dc92;stroke-width:.9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dw 2.6s ease forwards}
@keyframes dw{to{stroke-dashoffset:0}}
.fig.pulse svg{animation:pu 8s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(.9)}50%{transform:scale(1.06)}}
.dtl h2{text-align:center;margin-top:8px}.tag{text-align:center;color:var(--cy);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.today{border:1px solid rgba(234,203,136,.5);background:rgba(234,203,136,.08);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:14px;color:var(--gold);display:flex;align-items:center;justify-content:space-between;gap:10px}
.today button{appearance:none;border:1px solid var(--line);background:none;color:var(--gold);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.med{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 40%,#10205a,#050816 75%);display:grid;place-items:center;text-align:center;padding:24px}
.med .fig{width:min(80vw,320px)}.med .bt{font:400 30px 'Instrument Serif',serif;color:#f3e2b8;margin-top:18px;min-height:38px}.med .tm{color:var(--mut);margin-top:4px}
.med .btn{max-width:260px;margin:22px auto 0}
</style></head><body><canvas id="bg"></canvas><main>
<div class="hero"><img src="https://cdn.jsdelivr.net/gh/HelonUniverse/hub@e3ad06a1e907f1d87409738ecc22d945c20a473f/dlr/tiles/geometria.webp" alt=""><div class="tt"><div class="eb">Contemplación</div><h1>Geometría <em>sagrada</em></h1><p class="lead">Formas para mirar con calma.</p></div></div>
<div class="today"><span id="tdt">Tu forma de hoy</span><button id="tdb">Verla</button></div>
<div class="card"><h2>Elige una forma</h2><div class="sub2" style="text-align:left">Toca una para verla dibujarse y leer qué representa.</div><div class="fgrid" id="fg"></div></div>
<div class="card dtl" id="dt" hidden><div class="fig" id="fi"></div><h2 id="nm"></h2><div class="tag" id="tg"></div><p class="tx" id="ds"></p><p class="tx" id="ob" style="color:var(--mut)"></p><div class="pr" id="hy"></div><div class="row2"><button class="btn" id="cm">Contemplar 1 minuto</button></div><div id="gd"></div></div>
<p class="note">Las formas son un símbolo para contemplar y reflexionar. Los significados son tradicionales y simbólicos, no científicos.</p>
</main>
<div class="med" id="med" hidden><div><div class="fig pulse" id="mf"></div><div class="bt" id="mb"></div><div class="tm" id="mt"></div><button class="btn ghost" id="mx">Terminar</button></div></div>
<script>
const $=i=>document.getElementById(i);
function guardar(btn,texto){if(window.parent===window){btn.textContent='Ábrelo desde la app para guardar';return}parent.postMessage({dlr:'diario',texto:String(texto).slice(0,1800)},location.origin);btn.textContent='✓ Guardado en tu diario';btn.disabled=true}
function gbtn(texto){const b=document.createElement('button');b.className='btn ghost';b.textContent='♡ Guardar en mi diario';b.onclick=()=>guardar(b,texto);return b}
const P='pathLength="1"';
function circ(cx,cy,r,dl){return '<circle '+P+' cx="'+cx+'" cy="'+cy+'" r="'+r+'" style="animation-delay:'+dl+'s"/>'}
function poly(n,r,rot,dl,cx,cy){cx=cx||50;cy=cy||50;let p=[];for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(2)+','+(cy+r*Math.sin(a)).toFixed(2))}return '<polygon '+P+' points="'+p.join(' ')+'" style="animation-delay:'+dl+'s"/>'}
function star(n,k,r,rot,dl){let p=[];for(let i=0;i<n;i++){const a=rot+((i*k)%n)*2*Math.PI/n;p.push((50+r*Math.cos(a)).toFixed(2)+','+(50+r*Math.sin(a)).toFixed(2))}return '<polygon '+P+' points="'+p.join(' ')+'" style="animation-delay:'+dl+'s"/>'}
function spiral(){const f=(1+Math.sqrt(5))/2;let pts=[];for(let t=0;t<=3.1*Math.PI;t+=.06){const r=2.1*Math.pow(f,2*t/Math.PI);pts.push((38+r*Math.cos(t+3.6)).toFixed(2)+' '+(58+r*Math.sin(t+3.6)).toFixed(2))}
 return '<polyline '+P+' points="'+pts.join(' ')+'" style="animation-duration:3.6s"/>'}
function flower(){const r=14;let s='';const cs=[];for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){if(Math.max(Math.abs(i),Math.abs(j),Math.abs(i+j))<=2)cs.push([50+r*(i+j/2),50+r*j*Math.sqrt(3)/2])}
 cs.forEach((c,n)=>{const d=Math.hypot(c[0]-50,c[1]-50);s+=circ(c[0].toFixed(2),c[1].toFixed(2),r,(d/r*.45).toFixed(2))});return s+circ(50,50,r*3,1.6)}
const F=[
{n:'Círculo',t:'Unidad',g:()=>circ(50,50,40,0)+circ(50,50,1.2,1.2),d:'No tiene principio ni fin. Todas las demás figuras nacen de él. Representa lo completo, el ciclo y el centro desde el que todo empieza.',o:'Sigue el borde con la mirada y vuelve al punto del centro.',h:'Escribe una cosa que hoy sientes completa en tu vida.'},
{n:'Dos círculos',t:'Encuentro',g:()=>circ(36,50,26,0)+circ(64,50,26,.9),d:'Cuando dos círculos se cruzan nace una forma nueva en el centro. Habla de lo que aparece cuando dos cosas se encuentran: dos personas, dos ideas, la razón y la emoción.',o:'Mira el espacio que comparten, en el centro.',h:'Piensa en una relación o decisión y busca qué tienen en común las dos partes.'},
{n:'Triángulo',t:'Equilibrio',g:()=>circ(50,50,40,0)+poly(3,40,-Math.PI/2,.8),d:'Tres puntos forman la figura más estable: tres lados, tres apoyos. Se asocia con cuerpo, mente y emoción en equilibrio, o con pasado, presente y futuro.',o:'Cuenta cada vértice y piensa en un apoyo de tu vida.',h:'Del 1 al 10, anota cómo estás hoy en cuerpo, mente y ánimo.'},
{n:'Cuadrado',t:'Base',g:()=>poly(4,40,Math.PI/4,0)+circ(50,50,40*Math.SQRT1_2*Math.SQRT2,1),d:'Cuatro lados iguales y cuatro esquinas firmes. Es la forma de lo que se construye: el hogar, la rutina, la estructura que te sostiene.',o:'Fíjate en lo firme y parejo de cada lado.',h:'Elige una rutina pequeña que sostenga tu semana y empieza hoy.'},
{n:'Pentágono',t:'Crecimiento',g:()=>poly(5,40,-Math.PI/2,0)+star(5,2,40,-Math.PI/2,1),d:'Cinco lados y una estrella escondida en su interior donde aparece la proporción áurea. El número cinco se ve en flores, frutas cortadas y en tu propia mano. Se asocia con la vida que se desarrolla.',o:'Busca la estrella que se forma dentro.',h:'Corta una fruta o mira una flor y busca el número cinco.'},
{n:'Hexágono',t:'Orden',g:()=>poly(6,40,0,0)+star(6,1,40,0,.5)+'<path '+P+' d="M50 10V90M15.4 30L84.6 70M15.4 70L84.6 30" style="animation-delay:1s"/>',d:'Seis lados que encajan sin dejar huecos, como un panal. Muestra cómo la naturaleza reparte el espacio con el menor esfuerzo posible. Habla de armonía y orden.',o:'Mira cómo seis triángulos iguales llenan la figura.',h:'Ordena algo pequeño hoy: tu bolso, tu escritorio o tu agenda.'},
{n:'Espiral áurea',t:'Expansión',g:()=>spiral(),d:'Cada vuelta crece en la misma proporción, la proporción áurea, que aparece en caracoles, helechos y galaxias. Habla de crecer sin dejar de ser tú.',o:'Sigue la espiral desde el centro hacia afuera, despacio.',h:'Piensa en una sola cosa en la que has crecido este año.'},
{n:'Flor de la vida',t:'Patrón que se repite',g:()=>flower(),d:'Diecinueve círculos iguales que se cruzan formando un patrón que se repite. Es una de las figuras más usadas para contemplar, porque de ella salen las demás: círculos, triángulos, hexágonos.',o:'Mírala sin intentar entenderla.',h:'Contémplala un minuto sin hacer nada más.'}];
const svg=i=>'<svg viewBox="0 0 100 100" aria-hidden="true">'+F[i].g()+'</svg>';
let cur=-1;
F.forEach((f,i)=>{const b=document.createElement('button');b.className='fb';b.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true" style="stroke:#f3dda0;fill:none;stroke-width:2.2">'+f.g().replace(/style="[^"]*"/g,'').replace(/pathLength="1"/g,'')+'</svg><span>'+f.n+'</span>';b.onclick=()=>show(i);$('fg').append(b)});
function show(i){cur=i;[...$('fg').children].forEach((b,j)=>b.classList.toggle('on',j===i));const f=F[i];$('dt').hidden=false;$('fi').innerHTML=svg(i);$('nm').textContent=f.n;$('tg').textContent=f.t;$('ds').textContent=f.d;$('ob').textContent='Qué observar: '+f.o;$('hy').textContent='Para hoy: '+f.h;$('gd').textContent='';$('gd').append(gbtn('Geometría sagrada · '+f.n+' ('+f.t+'). '+f.d+' Para hoy: '+f.h));$('dt').scrollIntoView({behavior:'smooth',block:'start'})}
const n0=new Date(),di=(n0.getFullYear()*372+n0.getMonth()*31+n0.getDate())%F.length;
$('tdt').textContent='Tu forma de hoy: '+F[di].n;$('tdb').onclick=()=>show(di);
let tm=null;
$('cm').onclick=()=>{$('mf').innerHTML=svg(cur);$('med').hidden=false;let s=60,ph=0;const bt=['Inhala…','Exhala…'];$('mb').textContent=bt[0];$('mt').textContent=s+' s';clearInterval(tm);tm=setInterval(()=>{s--;if(s%4===0){ph=1-ph;$('mb').textContent=bt[ph]}$('mt').textContent=s+' s';if(s<=0){clearInterval(tm);$('mb').textContent='Gracias por detenerte.';$('mt').textContent='';$('mx').textContent='Volver'}},1000)};
$('mx').onclick=()=>{clearInterval(tm);$('med').hidden=true;$('mx').textContent='Terminar'};
(function(){const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,d,S=[],raf,last=0;const R=matchMedia('(prefers-reduced-motion: reduce)');
function rs(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);const n=Math.min(70,Math.max(24,W*H/16000|0));S=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.14,vy:(Math.random()-.5)*.14,r:.6+Math.random()*1,p:Math.random()*6.28}));dr(0)}
function dr(t){x.clearRect(0,0,W,H);const D=Math.min(140,Math.max(90,W*.17));for(let i=0;i<S.length;i++){const a=S[i];if(!R.matches){a.x=(a.x+a.vx+W)%W;a.y=(a.y+a.vy+H)%H}for(let j=i+1;j<S.length;j++){const b=S[j],q=Math.hypot(a.x-b.x,a.y-b.y);if(q<D){x.strokeStyle='rgba(234,203,136,'+(.2*(1-q/D)).toFixed(3)+')';x.lineWidth=.6;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}x.fillStyle='rgba(255,236,190,'+(.4+.25*Math.sin(t*.0007+a.p)).toFixed(3)+')';x.beginPath();x.arc(a.x,a.y,a.r,0,6.283);x.fill()}}
function f(t){if(t-last>30){dr(t);last=t}raf=requestAnimationFrame(f)}
addEventListener('resize',rs,{passive:true});rs();if(!R.matches)raf=requestAnimationFrame(f)})();

</script></body></html>
