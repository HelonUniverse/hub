<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06162c"><title>Respira conmigo · Desde la Red</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>:root{--cy:#7fe3f5;--gold:#eacb88;--mut:#a9c4d2;--line:rgba(234,203,136,.38)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 15% 8%,rgba(98,60,170,.45) 0%,transparent 55%),radial-gradient(ellipse at 90% 30%,rgba(24,150,170,.30) 0%,transparent 55%),linear-gradient(#070b24,#0a1233 55%,#050816) fixed;color:#eef9ff;font:15px/1.5 'Albert Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:620px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 18px 60px}
.hero{position:relative;margin:calc(-14px - env(safe-area-inset-top)) -18px 0;height:250px;overflow:hidden;text-align:left;padding:0}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:68% 50%}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,11,36,.88) 0%,rgba(7,11,36,.35) 55%,transparent 100%),linear-gradient(0deg,#070b24 0%,transparent 38%)}.hero .tt{position:absolute;left:20px;bottom:28px;z-index:2;max-width:54%}.hero h1{font-size:clamp(28px,8.4vw,38px)}
.eb{font-size:11px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
h1{font:400 clamp(34px,10vw,46px)/1.05 'Instrument Serif',Georgia,serif;margin:6px 0 4px}
h1 em{color:var(--gold);font-style:italic}
.lead{color:#cfd6ea;font-size:14px;margin:0;max-width:420px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.tab{appearance:none;border:1px solid var(--line);background:rgba(6,22,44,.6);border-radius:14px;padding:10px 4px;font-size:13px;cursor:pointer;line-height:1.2}
.tab.on{background:rgba(127,227,245,.16);box-shadow:0 0 14px rgba(80,220,255,.35)}
.card{border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(52,36,110,.55),rgba(10,18,52,.82));backdrop-filter:blur(6px);box-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);padding:18px;margin-top:14px}
h2{font:400 24px/1.1 'Instrument Serif',serif;margin:0 0 6px;color:#f3e2b8}
.in{width:100%;border:1px solid var(--line);background:rgba(6,22,44,.6);border-radius:14px;padding:13px 14px;font-size:16px;outline:0;margin-top:10px}
.in:focus{box-shadow:0 0 14px rgba(80,220,255,.35)}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 16px;background:linear-gradient(135deg,#f6e3ae,#d9b45f);color:#1a1230;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 6px 18px rgba(234,203,136,.30);width:100%;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.n{appearance:none;border:1px solid var(--line);border-radius:16px;background:rgba(6,22,44,.55);padding:14px 4px;cursor:pointer;font:400 26px/1 'Instrument Serif',serif;color:#f3e2b8;letter-spacing:.04em}
.n.on{background:rgba(234,203,136,.16);border-color:rgba(234,203,136,.7);box-shadow:0 0 16px rgba(234,203,136,.3)}
.res{margin-top:16px;text-align:center;animation:pop .5s cubic-bezier(.3,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.big{font:400 76px/1 'Instrument Serif',serif;color:var(--gold);text-shadow:0 0 28px rgba(234,203,136,.55);letter-spacing:.06em}
.res h3{font:400 26px/1.1 'Instrument Serif',serif;color:#f3e2b8;margin:6px 0 2px}
.res .kw{color:var(--cy);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.res p{margin:10px 0 0;text-align:left;color:#dff1f7;font-size:14.5px;line-height:1.65}
.res .pr{border:1px solid rgba(234,203,136,.35);border-radius:16px;padding:12px 14px;background:rgba(234,203,136,.07);margin-top:14px;text-align:left;font-size:14px;color:var(--gold)}
.note{color:#8fa9b8;font-size:12px;text-align:center;margin:18px 6px 0}
[hidden]{display:none!important}

.btn.ghost{background:none;color:var(--gold);border:1px solid var(--line);box-shadow:none;font-weight:500}
.btn[disabled]{opacity:.7}
.cardimg{width:min(62%,230px);aspect-ratio:2/3;margin:6px auto 0;border-radius:14px;border:1px solid rgba(234,203,136,.55);box-shadow:0 10px 28px rgba(0,0,0,.55);overflow:hidden;background:radial-gradient(circle at 50% 40%,#1b5e86,#0a2140 70%);display:grid;place-items:center;font:400 22px/1.15 'Instrument Serif',serif;color:#f3e2b8;padding:10px;text-align:center}
.cardimg img{width:100%;height:100%;object-fit:cover;display:block}
.orb{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9ff0ff,#1fb5dc 55%,#0a4a6e);box-shadow:0 0 60px rgba(80,220,255,.45);transform:scale(.55);transition:transform 4s ease-in-out}
.pw{height:230px;display:grid;place-items:center}
.say{text-align:center;font:400 34px 'Instrument Serif',serif;color:#f3e2b8;min-height:44px}
.cd{text-align:center;color:var(--gold);font-size:15px;min-height:22px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pick button{appearance:none;border:1px solid var(--line);background:rgba(6,22,44,.6);border-radius:14px;padding:11px 4px;font-size:14px;cursor:pointer}.pick button.on{background:rgba(127,227,245,.16);box-shadow:0 0 14px rgba(80,220,255,.35)}.tec{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tec button{appearance:none;text-align:left;border:1px solid var(--line);background:rgba(6,22,44,.6);border-radius:14px;padding:10px 12px;cursor:pointer;line-height:1.2}
.tec button b{display:block;font:400 18px/1.1 'Instrument Serif',serif;color:#f3e2b8}.tec button small{color:var(--mut);font-size:11.5px}
.tec button.on{background:rgba(234,203,136,.14);border-color:rgba(234,203,136,.7);box-shadow:0 0 14px rgba(234,203,136,.25)}
.tdesc{color:#cfd6ea;font-size:13.5px;margin:12px 2px 0;min-height:40px}.tec button:last-child:nth-child(odd){grid-column:1/-1}</style></head><body><canvas id="bg"></canvas><main>
<div class="hero"><img src="https://cdn.jsdelivr.net/gh/HelonUniverse/hub@c5a36e7c83a867b82e22b92569fd942a1e1372be/dlr/tiles/respira.webp" alt=""><div class="tt"><div class="eb">Pausa</div><h1>Respira <em>conmigo</em></h1><p class="lead">Inhala, sostén y exhala siguiendo el círculo.</p></div></div>
<div class="card"><h2>¿Qué necesitas hoy?</h2><div class="tec" id="tec"></div><p class="tdesc" id="tdesc"></p><h2 style="margin-top:16px">¿Cuánto tiempo?</h2><div class="pick" id="pk"><button data-s="60" class="on">1 minuto</button><button data-s="180">3 minutos</button><button data-s="300">5 minutos</button></div>
<div class="pw"><div class="orb" id="orb"></div></div><div class="say" id="say">Listo cuando tú lo estés</div><div class="cd" id="cd"></div><button class="btn" id="go">Comenzar</button></div>
<p class="note" id="tnote">Si te mareas, respira normal y descansa.</p>
</main>
<script>
const $=i=>document.getElementById(i);
function guardar(btn,texto){if(window.parent===window){btn.textContent='Ábrelo desde la app para guardar';return}parent.postMessage({dlr:'diario',texto:String(texto).slice(0,1800)},location.origin);btn.textContent='✓ Guardado en tu diario';btn.disabled=true}
function gbtn(texto){const b=document.createElement('button');b.className='btn ghost';b.textContent='♡ Guardar en mi diario';b.onclick=()=>guardar(b,texto);return b}
let secs=60,tm=null,run=false,left=0;
document.querySelectorAll('#pk button').forEach(b=>b.onclick=()=>{if(run)return;document.querySelectorAll('#pk button').forEach(x=>x.classList.toggle('on',x===b));secs=+b.dataset.s});
const orb=$('orb'),say=$('say'),cd=$('cd');
const T=[
{id:'calma',n:'Calma',q:'Bajar el ritmo',d:'Inhala 4 · sostén 4 · exhala 6. La más suave para empezar.',p:[['Inhala',4,1],['Sostén',4,1],['Exhala',6,.55],['Sostén',2,.55]]},
{id:'ansiedad',n:'Ansiedad',q:'Cuando estás acelerada',d:'Dos inhalaciones cortas y una exhalación muy larga. Ayuda a soltar la tensión rápido.',p:[['Inhala',2,.8],['Un poco más',1,1],['Exhala despacio',7,.5]]},
{id:'dormir',n:'Dormir',q:'Antes de acostarte',d:'Método 4-7-8: inhala 4 · sostén 7 · exhala 8. Relaja el cuerpo para dormir.',p:[['Inhala',4,1],['Sostén',7,1],['Exhala',8,.5]]},
{id:'enfoque',n:'Enfoque',q:'Para concentrarte',d:'Respiración en caja: 4 tiempos iguales. Ordena la mente.',p:[['Inhala',4,1],['Sostén',4,1],['Exhala',4,.55],['Sostén',4,.55]]},
{id:'equilibrio',n:'Equilibrio',q:'Centrarte',d:'Inhala 5 · exhala 5. Un ritmo parejo que estabiliza.',p:[['Inhala',5,1],['Exhala',5,.55]]},
{id:'soltar',n:'Soltar',q:'Tensión o enojo',d:'Inhala 4 y exhala 8 por la boca, como suspirando. Suelta lo que cargas.',p:[['Inhala',4,1],['Suelta',8,.45]]},
{id:'energia',n:'Energía',q:'Despertar el cuerpo',d:'Respiración rápida y ligera por la nariz. Hazla sentada y para si te mareas.',p:[['Inhala',2,1],['Exhala',2,.55]]}];
let tc=T[0],ST=tc.p;
(function(){const b=$('tec');T.forEach(t=>{const e=document.createElement('button');e.innerHTML='<b></b><small></small>';e.firstChild.textContent=t.n;e.lastChild.textContent=t.q;e.onclick=()=>pick(t);e.dataset.id=t.id;b.append(e)});})();
function pick(t){if(run)return;tc=t;ST=t.p;$('tdesc').textContent=t.d;document.querySelectorAll('#tec button').forEach(x=>x.classList.toggle('on',x.dataset.id===t.id))}
pick(T[0]);
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function stop(done){run=false;clearTimeout(tm);$('go').textContent='Comenzar';orb.style.transition='transform 2s ease-in-out';orb.style.transform='scale(.55)';say.textContent=done?'Muy bien. Quédate un momento con esta calma.':'Listo cuando tú lo estés';cd.textContent='';if(done){cd.append(gbtn('Hice la respiración «'+tc.n+'» de '+Math.round(secs/60)+' minuto(s). Me siento…'))}}
function step(i){if(!run)return;const s=ST[i%ST.length];say.textContent=s[0];orb.style.transition='transform '+s[1]+'s ease-in-out';orb.style.transform='scale('+s[2]+')';let t=s[1];const tick=()=>{if(!run)return;left--;cd.textContent=fmt(Math.max(left,0));t--;if(left<=0)return stop(true);if(t>0)tm=setTimeout(tick,1000);else step(i+1)};tm=setTimeout(tick,1000)}
$('go').onclick=()=>{if(run)return stop(false);run=true;left=secs;cd.textContent=fmt(left);$('go').textContent='Detener';step(0)}
(function(){const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,d,S=[],raf,last=0;const R=matchMedia('(prefers-reduced-motion: reduce)');
function rs(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);const n=Math.min(70,Math.max(24,W*H/16000|0));S=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.14,vy:(Math.random()-.5)*.14,r:.6+Math.random()*1,p:Math.random()*6.28}));dr(0)}
function dr(t){x.clearRect(0,0,W,H);const D=Math.min(140,Math.max(90,W*.17));for(let i=0;i<S.length;i++){const a=S[i];if(!R.matches){a.x=(a.x+a.vx+W)%W;a.y=(a.y+a.vy+H)%H}for(let j=i+1;j<S.length;j++){const b=S[j],q=Math.hypot(a.x-b.x,a.y-b.y);if(q<D){x.strokeStyle='rgba(234,203,136,'+(.2*(1-q/D)).toFixed(3)+')';x.lineWidth=.6;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}x.fillStyle='rgba(255,236,190,'+(.4+.25*Math.sin(t*.0007+a.p)).toFixed(3)+')';x.beginPath();x.arc(a.x,a.y,a.r,0,6.283);x.fill()}}
function f(t){if(t-last>30){dr(t);last=t}raf=requestAnimationFrame(f)}
addEventListener('resize',rs,{passive:true});rs();if(!R.matches)raf=requestAnimationFrame(f)})();

</script></body></html>
