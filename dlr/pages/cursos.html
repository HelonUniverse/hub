esp:['Hay días en los que estamos para todo y para todos, y dejamos nuestra propia voz para el final. Este diario es una invitación a hacerle un lugar. Aquí puedes escribir con sinceridad, sin buscar respuestas perfectas.','No tienes que convertirte en otra persona para empezar. Puedes llegar como estás, tomar lo que te sirva y dejar lo que hoy no necesites.',{b:'Tu encuentro de diez minutos:',ul:['1 minuto · Detente y observa cómo llegas.','2 minutos · Lee la reflexión y prueba el ejercicio.','5 minutos · Responde las preguntas a tu manera.','2 minutos · Elige el pequeño paso del día.']},'No es necesario hacer los siete días seguidos. Continúa a tu ritmo.'],
trae:'',
cuidado:['Este es un recurso de reflexión personal, no una terapia. Puedes saltar cualquier pregunta o detenerte si te resulta intensa. No necesitas explorar recuerdos dolorosos para participar.'],
pausa:[],
mods:[
{t:'Día 1 · Cómo estoy hoy',s:'Escucharme sin exigirme estar bien.',h:'Escucharme sin exigirme estar bien',nores:1,
c:['A veces seguimos adelante sin preguntarnos cómo estamos. Respondemos, resolvemos y acompañamos. Hoy puedes dejar un momento esas tareas y escucharte. No necesitas encontrar una emoción bonita ni explicar todo lo que sientes. Tal vez haya cansancio, alegría, enojo o varias cosas juntas. Darles un nombre puede ayudarte a reconocer este momento, sin convertirlo en una definición de quién eres.',{b:'Una práctica breve.',t:'Apoya los pies y mira a tu alrededor. Observa tres detalles del lugar. Luego completa: «Hoy me siento…». Si no encuentras una palabra, describe cómo ha sido tu día.'}],
r:['¿Qué siento hoy y en qué momento lo noté?','¿Cómo puedo tratarme con amabilidad esta tarde?'],
p:{t:'Mi pequeño paso',f:[],paso:'Haz una pausa de dos minutos antes de tu próxima tarea. Hoy puedo empezar por reconocer cómo estoy.'}},
{t:'Día 2 · Qué necesito',s:'Hacer espacio para lo que vengo postergando.',h:'Hacer espacio para lo que vengo postergando',nores:1,
c:['Lo que necesitas no siempre coincide con lo que esperas de ti. Quizás te pides rendir más cuando necesitas descanso. Tal vez buscas una respuesta cuando lo que deseas es que alguien te escuche. Reconocer una necesidad no obliga a resolverla toda hoy. Te permite elegir un primer gesto de cuidado dentro de tu realidad.',{b:'Una práctica breve.',t:'Escribe tres posibilidades: descanso, compañía, silencio, ayuda, alimento, movimiento o tiempo a solas. Elige la que más se acerque a tu día.'}],
r:['¿Qué necesito y qué señal me ayudó a reconocerlo?','¿Qué puedo hacer o pedir de forma concreta?'],
p:{t:'Mi pequeño paso',f:[],paso:'Formula una petición sencilla: «Hoy me ayudaría que…». Mis necesidades también merecen un lugar.'}},
{t:'Día 3 · Qué me pesa',s:'Poner en palabras lo que ocupa mi mente.',h:'Poner en palabras lo que ocupa mi mente',nores:1,
c:['Hay asuntos que nos acompañan incluso mientras hacemos otras cosas. Escribirlos puede ayudarnos a distinguirlos. No hace falta revivir una experiencia dolorosa ni encontrar una enseñanza. Puedes nombrar solo lo que hoy quieras mirar. Algunas preocupaciones permiten una acción pequeña; otras necesitan tiempo, compañía o aceptar que no dependen de ti.',{b:'Una práctica breve.',t:'Anota una preocupación cotidiana. Separa en dos columnas lo que puedes hacer y lo que no depende de ti. Si este ejercicio te incomoda, vuelve a describir algo que ves a tu alrededor.'}],
r:['¿Qué me está pesando y cuánto quiero explorar hoy?','¿Cuál es mi siguiente paso posible, o qué apoyo necesito?'],
p:{t:'Mi pequeño paso',f:[],paso:'Elige una sola acción breve. Si no hay una posible hoy, deja escrito cuándo volverás a revisar el asunto. Puedo atender una cosa a la vez.'}},
{t:'Día 4 · Dónde están mis límites',s:'Cuidar mi tiempo, mi energía y mis decisiones.',h:'Cuidar mi tiempo, mi energía y mis decisiones',nores:1,
c:['Un límite expresa lo que puedes ofrecer y lo que necesitas cuidar. A veces decirlo resulta incómodo, especialmente si estás acostumbrada a estar disponible. Puedes practicar con una situación pequeña y una frase clara. No necesitas convencer a la otra persona de sentir lo mismo. Sí puedes elegir cómo comunicarte y qué harás para sostener tu decisión.',{b:'Una práctica breve.',t:'Piensa en una petición cotidiana que te cueste responder. Ensaya: «Hoy no puedo hacerlo. Puedo ayudarte mañana durante quince minutos», o simplemente: «Esta vez no voy a poder».'}],
r:['¿En qué situación digo que sí cuando quisiera detenerme?','¿Qué límite concreto quiero expresar y cómo lo diría?'],
p:{t:'Mi pequeño paso',f:[],paso:'Antes de aceptar algo, responde: «Voy a revisarlo y te confirmo». Puedo darme tiempo antes de responder.'}},
{t:'Día 5 · Qué disfruto',s:'Recordar lo que me hace bien en lo cotidiano.',h:'Recordar lo que me hace bien en lo cotidiano',nores:1,
c:['Entre las obligaciones, el disfrute puede quedar para después. Hoy te invito a recordar algo sencillo: una canción, una receta, la luz de la mañana o caminar sin mirar el teléfono. No necesitas sentir entusiasmo de inmediato. Puedes acercarte con curiosidad a una experiencia agradable, sin exigirle que cambie todo tu día.',{b:'Una práctica breve.',t:'Haz una lista de cinco cosas pequeñas que disfrutas o disfrutabas. Marca una que sea accesible hoy y que no requiera una compra.'}],
r:['¿Qué actividad me permite estar presente y disfrutar?','¿Cómo puedo hacerle espacio esta semana?'],
p:{t:'Mi pequeño paso',f:[],paso:'Dedica cinco minutos a una de esas experiencias, sin convertirla en otra obligación. También puedo reservar un momento para disfrutar.'}},
{t:'Día 6 · Qué elijo',s:'Dar un paso que dependa de mí.',h:'Dar un paso que dependa de mí',nores:1,
c:['Cuando miramos todo lo que quisiéramos cambiar, empezar puede parecer demasiado. Una elección pequeña vuelve el camino más concreto. No necesitas una decisión definitiva sobre tu vida. Puedes elegir una acción que se parezca un poco más a lo que valoras: descansar, crear, aprender, compartir o cuidar tu espacio.',{b:'Una práctica breve.',t:'Elige algo que te importe. Escríbelo junto a una acción de diez minutos o menos. Por ejemplo: «Valoro la creatividad; hoy escribiré un párrafo».'}],
r:['¿Qué quiero cuidar o cultivar en este momento?','¿Qué haré, cuándo lo haré y qué necesito para empezar?'],
p:{t:'Mi pequeño paso',f:[],paso:'Realiza la versión más pequeña de tu elección. Observa cómo resultó sin calificarte. Un paso pequeño también es una elección.'}},
{t:'Día 7 · Cómo continúo',s:'Crear una práctica que pueda sostener.',h:'Crear una práctica que pueda sostener',nores:1,
c:['Llegar hasta aquí no significa que tengas que sentirte diferente. Quizás encontraste una palabra, una necesidad o una pregunta que antes no veías. También puede que algunos días no hayas escrito. Lo valioso es reconocer qué te sirvió y qué quieres adaptar. Este diario puede acompañarte nuevamente sin convertirse en una medida de tu constancia.',{b:'Una práctica breve.',t:'Revisa tus páginas con curiosidad. Subraya una frase que quieras conservar y elige una práctica breve para la próxima semana.'}],
r:['¿Qué descubrí y qué ejercicio me resultó útil?','¿Qué práctica repetiré, cuándo y por cuánto tiempo?'],
p:{t:'Mi pequeño paso',f:[],paso:'Reserva un momento realista en tu semana. Si lo omites, retómalo cuando puedas. Puedo volver a mí tantas veces como lo necesite.'}},
{t:'Lo que me llevo',s:'Integración y una carta para mí.',h:'Lo que me llevo',nores:1,
c:['No busques un gran cambio para darle valor a este recorrido. Reúne aquí lo que quieras recordar.'],
r:[],
p:{t:'Integración',f:['Una palabra que describe estos días…','Una necesidad que quiero seguir escuchando…','Un límite o una elección que quiero cuidar…','Mi práctica para la próxima semana será…','Una carta para mí. Puedes empezar así: «Quiero recordarme que…»'],paso:'Si un día me olvido, puedo comenzar otra vez.'}}],
cierre:['Gracias por hacerte un lugar.','Puedes volver a este diario cuando quieras. Si un día te olvidas, puedes comenzar otra vez.']}

];
const $=i=>document.getElementById(i);
const KEY='dlr-cursos-v1';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function cs(id){return S[id]||(S[id]={})}
function ms(id,i){const c=cs(id);return c['m'+i]||(c['m'+i]={})}
function prog(c){const k=cs(c.id);let d=0;c.mods.forEach((m,i)=>{if((k['m'+i]||{}).ok)d++});return [d,c.mods.length]}
let V={v:'home'};
function go(v){V=v;render();scrollTo(0,0)}
function para(x){
 if(typeof x==='string')return '<p>'+esc(x)+'</p>';
 if(x.cards)return x.cards.map(k=>'<div class="mini"><h3>'+esc(k.h)+'</h3>'+k.p.map(t=>'<p>'+esc(t)+'</p>').join('')+'</div>').join('');
 let h='';if(x.b&&x.t)h+='<p><b>'+esc(x.b)+'</b> '+esc(x.t)+'</p>';else if(x.b)h+='<p><b>'+esc(x.b)+'</b></p>';
 if(x.ul)h+='<ul>'+x.ul.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>';return h}
function ta(id,key,label,val){return '<div class="q"><label>'+esc(label)+'</label><textarea data-c="'+id+'" data-k="'+key+'" rows="3">'+esc(val||'')+'</textarea></div>'}
function home(){
 const gr=[['sanar','Para sanar y cuidarte'],['comprender','Para comprender'],['reiki','Reiki']];
 let h='<div class="eb">Desde la Red</div><h1>Tus <em>cursos</em></h1><p class="lead">Guías para recorrer a tu ritmo: lees, te preguntas, practicas y todo queda guardado en tu teléfono.</p>';
const COV={'nino-interior':1,'limites-sanos':1,'vinculo-conmigo':1,'linaje-materno':1,'linaje-paterno':1,'antes-de-nacer':1,'volver-a-mi':1,'registros-akashicos':1,'reiki-1':1,'reiki-2':1};Object.keys(COV).forEach(k=>COV[k]='https://cdn.jsdelivr.net/gh/HelonUniverse/hub@b7dcbd633d75e949b4b339799d726736ad3d2eee/dlr/tiles/cursos/'+k+'.webp');
 h+='<div class="gt">Programas con lecciones</div>';[['dones','Despierta tus dones','Tres enseñanzas para descubrir tus dones',268,'✧'],['dharma','Camino del Dharma','Lecciones para encontrar tu camino',45,'☸'],['biodec','Biodecodificación','Qué dice tu cuerpo de lo que sientes',160,'❋']].forEach(([id,n,d,hu,gl])=>{h+='<button class="cc" style="--h:'+hu+'" data-open="'+id+'"><span class="gl">'+gl+'</span><b>'+n+'</b><span class="s">'+d+'</span></button>'});
 gr.forEach(([g,n])=>{h+='<div class="gt">'+n+'</div>';CURSOS.filter(c=>c.grupo===g).forEach(c=>{const [d,t]=prog(c);
  const cv=COV[c.id];h+='<button class="cc'+(cv?' hv':'')+'" style="--h:'+c.hue+(cv?';--cv:url('+cv+')':'')+'" data-go="'+c.id+'"><span class="gl">'+c.glyph+'</span><b>'+esc(c.t)+'</b><span class="s">'+esc(c.tiempo)+(d?' · '+d+' de '+t+' completos':'')+'</span><div class="pb"><i style="width:'+Math.round(d/t*100)+'%"></i></div></button>'})});
 h+='<p class="note">Material de reflexión y estudio. No reemplaza terapia ni atención médica.</p>';return h}
function course(c){
 const [d,t]=prog(c),k=cs(c.id);
 let h='<button class="back" data-go="">← Cursos</button><div class="eb">'+esc(c.tiempo)+'</div><h1>'+esc(c.t)+'</h1><p class="tag">'+esc(c.tag)+'</p><p class="lead">'+esc(c.desc)+'</p><div class="pb"><i style="width:'+Math.round(d/t*100)+'%"></i></div>';
 h+='<details><summary>Antes de empezar</summary><div class="rd">'+c.esp.map(para).join('')+(c.trae?ta(c.id,'trae',c.reiki?c.trae:'¿Qué me trae a estas páginas? '+c.trae,k.trae):'')+'<h3 style="margin-top:14px">Cómo cuidar este proceso</h3>'+c.cuidado.map(para).join('')+c.pausa.map((p,i)=>ta(c.id,'pa'+i,p,k['pa'+i])).join('')+'</div></details>';
 h+='<div class="gt">Tu recorrido</div>';
 c.mods.forEach((m,i)=>{const ok=(k['m'+i]||{}).ok;h+='<button class="ml'+(ok?' ok':'')+'" data-m="'+i+'"><span class="n">'+(ok?'✓':i+1)+'</span><span><b>'+esc(m.t)+'</b><small>'+esc(m.s)+'</small></span></button>'});
 if(d===t)h+='<div class="card done"><div class="big">✦</div><h2>Curso completo</h2>'+c.cierre.map(para).join('')+'</div>';
 else h+='<details><summary>Cierre</summary><div class="rd">'+c.cierre.map(para).join('')+'</div></details>';
 return h}
function stepsOf(c,m){return c.reiki?['Leer','Mis notas']:['Comprender'].concat(m.r.length?['Reflexionar']:[],m.p?['Practicar']:[])}
function mod(c,i){
 const m=c.mods[i],k=ms(c.id,i),st=stepsOf(c,m),s=Math.min(V.s||0,st.length-1);
 let h='<button class="back" data-go="'+c.id+'">← '+esc(c.t)+'</button><div class="eb">Módulo '+(i+1)+' de '+c.mods.length+'</div><h1 style="font-size:clamp(30px,9vw,40px)">'+esc(m.t)+'</h1>';
 h+='<div class="steps">'+st.map((x,j)=>'<button class="st'+(j===s?' on':'')+'" data-s="'+j+'">'+x+'</button>').join('')+'</div><div class="card rd">';
 const nm=st[s];
 if(nm==='Comprender'||nm==='Leer'){h+='<h2>'+esc(m.h)+'</h2>'+m.c.map(para).join('');if(m.rec)h+='<div class="rec"><b>Para recordar</b><ul>'+m.rec.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></div>'}
 else if(nm==='Reflexionar'){h+='<h2>Escuchar mi experiencia</h2><p class="sub">'+esc(RESN)+'</p>'+(m.nores?'':ta(c.id,'m'+i+'r',RES,k.res))+m.r.map((q,j)=>ta(c.id,'m'+i+'r'+j,q,(k.r||{})[j])).join('')}
 else if(nm==='Practicar'){h+='<h2>'+esc(m.p.t)+'</h2>'+(m.p.i?'<p class="sub">'+esc(m.p.i)+'</p>':'')+m.p.f.map((q,j)=>ta(c.id,'m'+i+'p'+j,q,(k.p||{})[j])).join('')+'<div class="paso"><b>Un paso en el presente</b>'+esc(m.p.paso)+'</div>'}
 else{h+='<h2>Mis notas</h2><p class="sub">Escribe lo que quieras recordar de este módulo.</p>'+ta(c.id,'m'+i+'n','Notas',k.n)}
 h+='</div><div class="row2">'+(s>0?'<button class="btn ghost" data-s="'+(s-1)+'">Anterior</button>':'')+(s<st.length-1?'<button class="btn" data-s="'+(s+1)+'">Siguiente</button>':'<button class="btn" id="fin">'+(k.ok?'Módulo completo ✓':'Marcar módulo completo')+'</button>')+'</div>';
 if(s===st.length-1&&(c.reiki?k.n:(k.res||k.r||k.p)))h+='<button class="btn ghost" id="dia">♡ Guardar mis respuestas en mi diario</button>';
 return h}
function render(){
 const a=$('app');let c=CURSOS.find(x=>x.id===V.c);
 a.innerHTML=V.v==='home'?home():V.v==='course'?course(c):mod(c,V.i)}
function gather(c,i){const m=c.mods[i],k=ms(c.id,i);let o=c.t+' · '+m.t+'\n';
 if(c.reiki){if(k.n)o+='\n'+k.n}else{if(k.res)o+='\n'+RES+'\n'+k.res+'\n';(m.r||[]).forEach((q,j)=>{const v=(k.r||{})[j];if(v)o+='\n'+q+'\n'+v+'\n'});if(m.p)(m.p.f||[]).forEach((q,j)=>{const v=(k.p||{})[j];if(v)o+='\n'+q+'\n'+v+'\n'})}
 return o.trim().slice(0,1800)}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.open){parent.postMessage({dlr:'abrir',id:b.dataset.open},location.origin);return}
 if(b.dataset.go!==undefined){go(b.dataset.go?{v:'course',c:b.dataset.go}:{v:'home'});return}
 if(b.dataset.m!==undefined){go({v:'mod',c:V.c,i:+b.dataset.m,s:0});return}
 if(b.dataset.s!==undefined){V.s=+b.dataset.s;render();scrollTo(0,0);return}
 const c=CURSOS.find(x=>x.id===V.c);
 if(b.id==='fin'){const k=ms(c.id,V.i);k.ok=1;save();const nx=V.i+1;if(nx<c.mods.length)go({v:'mod',c:c.id,i:nx,s:0});else go({v:'course',c:c.id})}
 if(b.id==='dia'){if(window.parent===window){b.textContent='Ábrelo desde la app para guardar';return}parent.postMessage({dlr:'diario',texto:gather(c,V.i)},location.origin);b.textContent='✓ Guardado en tu diario';b.disabled=true}
});
let T;document.addEventListener('input',e=>{const t=e.target;if(t.tagName!=='TEXTAREA')return;const id=t.dataset.c,key=t.dataset.k,k=cs(id);
 let m;if(key==='trae'||/^pa\d+$/.test(key))k[key]=t.value;
 else if(m=/^m(\d+)(r|p|n)(\d*)$/.exec(key)){const o=ms(id,+m[1]);if(m[2]==='n')o.n=t.value;else if(m[2]==='r'&&m[3]==='')o.res=t.value;else{const f=m[2];o[f]=o[f]||{};o[f][m[3]]=t.value}}
 clearTimeout(T);T=setTimeout(save,300)});
addEventListener('pagehide',save);
if(CURSOS.length){const q=(new URLSearchParams(location.search).get('c')||new URLSearchParams(location.hash.slice(1)).get('c'));if(q&&CURSOS.find(x=>x.id===q))V={v:'course',c:q}}
render();
</script></body></html>
