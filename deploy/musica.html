<style>

.thumb{width:56px;height:56px;border-radius:10px;flex:none;background:url(https://cdn.jsdelivr.net/gh/HelonUniverse/hub@84c5533e88f7bd244db79121a8a9f7400cd8c58d/dlr/tiles/cover-pulsos.webp) center/cover}

</style></head><body>

<script>
const AU='https://raw.githubusercontent.com/HelonUniverse/hub/3682399b9f8ac2f825fd36f7d229a1dc1523d96d/dlr/audio/';
const T=[
{f:'kodoish-pulso-sagrado-desde-la-red',n:'Kodoish',d:'Pulso Sagrado · 3:40'},
{f:'waheguru-pulso-de-luz',n:'Waheguru',d:'Pulso de Luz · 3:33'},
{f:'gayatri-mantra-pulso-de-luz',n:'Gayatri Mantra',d:'Pulso de Luz · 3:32'},
{f:'om-namah-shivaya-pulso-de-serenidad',n:'Om Namah Shivaya',d:'Pulso de Serenidad · 3:11'},
{f:'om-gam-ganapataye-namaha-pulso-de-apertura',n:'Om Gam Ganapataye Namaha',d:'Pulso de Apertura · 3:14'},
{f:'om-hanumate-namaha-pulso-de-valenti-a',n:'Om Hanumate Namaha',d:'Pulso de Valentía · 3:33'},
{f:'hare-krishna-pulso-de-devocio-n',n:'Hare Krishna',d:'Pulso de Devoción · 3:46'},
{f:'om-tare-tuttare-ture-soha-desde-la-red',n:'Om Tare Tuttare Ture Soha',d:'Desde la Red · 3:10'},

{yt:'gJ8kn71d3ic',n:'Sound Reset',d:'Cuencos tibetanos y de cristal · video'}];
const $=i=>document.getElementById(i);let fav={};try{fav=JSON.parse(localStorage.getItem('dlr-fav')||'{}')}catch(e){}
let cur=-1,shuf=false,P=null,ready=false,playing=false,mode='';const A=new Audio();A.preload='none';
function key(t){return t.f||t.yt}
function row(t,i){const d=document.createElement('div');d.className='tr';d.innerHTML='<span class="p">▶</span><b></b><button class="h" aria-label="Favorito">♡</button>';d.querySelector('b').innerHTML='<span></span><small></small>';d.querySelector('b span').textContent=t.n;d.querySelector('small').textContent=t.d;const h=d.querySelector('.h');if(fav[key(t)]){h.textContent='♥';h.classList.add('on')}
h.onclick=e=>{e.stopPropagation();const k=key(t);fav[k]=!fav[k];h.textContent=fav[k]?'♥':'♡';h.classList.toggle('on',!!fav[k]);try{localStorage.setItem('dlr-fav',JSON.stringify(fav))}catch(x){}};
d.onclick=()=>playAt(i);return d}
T.forEach((t,i)=>{if(i===11){const h=document.createElement('div');h.className='div';h.textContent='Canciones y meditaciones';$('list').append(h)}$('list').append(row(t,i))});

function setPlaying(p){playing=p;$('mp').textContent=p?'❚❚':'▶';$('play').textContent=p?'❚❚':'▶';mark()}
A.onplay=()=>setPlaying(true);A.onpause=()=>setPlaying(false);A.onended=next;
function mark(){document.querySelectorAll('.tr').forEach((d,i)=>{d.classList.toggle('on',i===cur);d.querySelector('.p').textContent=i===cur&&playing?'❚❚':'▶'})}
function playAt(i){cur=i;const t=T[i];$('mini').classList.add('on');$('mt').textContent=t.n;
if(t.f){if(ready&&mode==='yt')P.stopVideo();mode='mp3';$('yt').parentElement.style.display='none';$('thumb').style.display='block';A.src=AU+t.f+'.mp3';A.play().catch(()=>{})}
else{A.pause();mode='yt';$('thumb').style.display='none';$('yt').parentElement.style.display='block';if(ready){P.loadVideoById(t.yt);P.playVideo()}}
mark()}
function toggle(){if(cur<0)return playAt(shuf?Math.random()*T.length|0:0);if(mode==='mp3'){A.paused?A.play():A.pause()}else if(ready){playing?P.pauseVideo():P.playVideo()}}
function next(){if(shuf){let j;do{j=Math.random()*T.length|0}while(j===cur&&T.length>1);playAt(j)}else playAt((cur+1)%T.length)}
$('play').onclick=toggle;$('mp').onclick=toggle;$('mn').onclick=next;
$('shuf').onclick=()=>{shuf=!shuf;$('shuf').classList.toggle('on',shuf)};
setInterval(()=>{if(cur<0)return;let d=0,c=0;if(mode==='mp3'){d=A.duration||0;c=A.currentTime||0}else if(ready&&P.getDuration){d=P.getDuration()||0;c=P.getCurrentTime()||0}$('pb').style.width=(d?c/d*100:0)+'%'},500);
(function(){const c=$('bg'),x=c.getContext('2d'),rm=matchMedia('(prefers-reduced-motion:reduce)');let W,H,S=[];

function dr(t){x.clearRect(0,0,W,H);const D=Math.min(150,Math.max(95,W*.18));S.forEach((a,i)=>{if(!rm.matches){a.x=(a.x+a.vx+W)%W;a.y=(a.y+a.vy+H)%H}for(let j=i+1;j<S.length;j++){const b=S[j],q=Math.hypot(a.x-b.x,a.y-b.y);if(q<D){x.strokeStyle='rgba(115,222,239,'+(.26*(1-q/D)).toFixed(3)+')';x.lineWidth=.7;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}x.fillStyle='rgba(185,245,252,'+(.45+.3*Math.sin(t*.0007+a.p)).toFixed(2)+')';x.beginPath();x.arc(a.x,a.y,a.r,0,6.3);x.fill()});if(!rm.matches)requestAnimationFrame(dr)}
addEventListener('resize',rs);rs();requestAnimationFrame(dr)})();
</script></body></html>
