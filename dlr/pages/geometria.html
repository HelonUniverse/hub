<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06162c"><title>Geometría sagrada · Desde la Red</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>:root{--cy:#7fe3f5;--gold:#eacb88;--mut:#a9c4d2;--line:rgba(234,203,136,.38)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 15% 8%,rgba(98,60,170,.45) 0%,transparent 55%),radial-gradient(ellipse at 90% 30%,rgba(24,150,170,.30) 0%,transparent 55%),linear-gradient(#070b24,#0a1233 55%,#050816) fixed;color:#eef9ff;font:15px/1.5 'Albert Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:620px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 18px 60px}
.hero{position:relative;margin:calc(-14px - env(safe-area-inset-top)) -18px 0;height:250px;overflow:hidden;text-align:left;padding:0}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:68% 50%}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,11,36,.88) 0%,rgba(7,11,36,.35) 55%,transparent 100%),linear-gradient(0deg,#070b24 0%,transparent 38%)}.hero .tt{position:absolute;left:20px;bottom:28px;z-index:2;max-width:54%}.hero h1{font-size:clamp(28px,8.4vw,38px)}
.eb{font-size:11px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
h1{font:400 clamp(34px,10vw,46px)/1.05 'Instrument Serif',Georgia,serif;margin:6px 0 4px}
h1 em{color:var(--gold);font-style:italic}
.lead{color:#cfd6ea;font-size:14px;margin:0;max-width:420px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.tab{appearance:none;border:1px solid var(--line);background:rgba(6,22,44,.6);border-radius:14px;padding:10px 4px;font-size:13px;cursor:pointer;line-height:1.2}
.tab.on{background:rgba(127,227,245,.16);box-shadow:0 0 14px rgba(80,220,255,.35)}
.card{border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(52,36,110,.55),rgba(10,18,52,.82));backdrop-filter:blur(6px);box-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);padding:18px;margin-top:14px}
h2{font:400 24px/1.1 'Instrument Serif',serif;margin:0 0 6px;color:#f3e2b8}
.in{width:100%;border:1px solid var(--line);background:rgba(6,22,44,.6);border-radius:14px;padding:13px 14px;font-size:16px;outline:0;margin-top:10px}
.in:focus{box-shadow:0 0 14px rgba(80,220,255,.35)}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 16px;background:linear-gradient(135deg,#f6e3ae,#d9b45f);color:#1a1230;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 6px 18px rgba(234,203,136,.30);width:100%;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.n{appearance:none;border:1px solid var(--line);border-radius:16px;background:rgba(6,22,44,.55);padding:14px 4px;cursor:pointer;font:400 26px/1 'Instrument Serif',serif;color:#f3e2b8;letter-spacing:.04em}
.n.on{background:rgba(234,203,136,.16);border-color:rgba(234,203,136,.7);box-shadow:0 0 16px rgba(234,203,136,.3)}
.res{margin-top:16px;text-align:center;animation:pop .5s cubic-bezier(.3,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.big{font:400 76px/1 'Instrument Serif',serif;color:var(--gold);text-shadow:0 0 28px rgba(234,203,136,.55);letter-spacing:.06em}
.res h3{font:400 26px/1.1 'Instrument Serif',serif;color:#f3e2b8;margin:6px 0 2px}
.res .kw{color:var(--cy);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.res p{margin:10px 0 0;text-align:left;color:#dff1f7;font-size:14.5px;line-height:1.65}
.res .pr{border:1px solid rgba(234,203,136,.35);border-radius:16px;padding:12px 14px;background:rgba(234,203,136,.07);margin-top:14px;text-align:left;font-size:14px;color:var(--gold)}
.note{color:#8fa9b8;font-size:12px;text-align:center;margin:18px 6px 0}
[hidden]{display:none!important}

.btn.ghost{background:none;color:var(--gold);border:1px solid var(--line);box-shadow:none;font-weight:500}
.btn[disabled]{opacity:.7}
.cardimg{width:min(62%,230px);aspect-ratio:2/3;margin:6px auto 0;border-radius:14px;border:1px solid rgba(234,203,136,.55);box-shadow:0 10px 28px rgba(0,0,0,.55);overflow:hidden;background:radial-gradient(circle at 50% 40%,#1b5e86,#0a2140 70%);display:grid;place-items:center;font:400 22px/1.15 'Instrument Serif',serif;color:#f3e2b8;padding:10px;text-align:center}
.cardimg img{width:100%;height:100%;object-fit:cover;display:block}
.moon{position:relative;width:170px;height:170px;margin:26px auto 0;border-radius:50%;box-shadow:0 0 38px 8px rgba(255,236,170,.40),0 0 110px 30px rgba(234,203,136,.20)}.moon:before{content:'';position:absolute;inset:-18px;border-radius:50%;border:1px solid rgba(234,203,136,.55)}.moon:after{content:'✦';position:absolute;left:50%;top:-30px;transform:translateX(-50%);color:var(--gold);font-size:16px;text-shadow:0 0 10px rgba(234,203,136,.8)}
.moon svg{width:100%;height:100%;display:block}
.sub2{color:var(--mut);font-size:13px;text-align:center;margin-top:4px}
.tx{margin:12px 0 0;color:#dff1f7;font-size:14.5px;line-height:1.65}
.pr{border:1px solid rgba(234,203,136,.35);border-radius:16px;padding:12px 14px;background:rgba(234,203,136,.07);margin-top:14px;font-size:14px;color:var(--gold)}
.nx{display:flex;gap:10px;margin-top:14px;margin-bottom:12px}.nx div{flex:1;border:1px solid var(--line);background:rgba(234,203,136,.05);border-radius:14px;padding:10px;text-align:center;font-size:12.5px;color:var(--mut)}.nx b{display:block;font:400 18px 'Instrument Serif',serif;color:#f3e2b8}
.hero .tt{max-width:46%}.hero img{object-position:62% 50%}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.fb{appearance:none;border:1px solid var(--line);border-radius:16px;background:rgba(6,22,44,.55);padding:8px 4px 6px;cursor:pointer;color:#f3e2b8;font-size:11.5px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:4px}
.fb svg{width:100%;max-width:56px;height:auto}.fb.on{background:rgba(234,203,136,.16);border-color:rgba(234,203,136,.75);box-shadow:0 0 16px rgba(234,203,136,.3)}
.fig{width:min(78%,260px);aspect-ratio:1;margin:8px auto 0;position:relative}
.fig svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 7px rgba(234,203,136,.65))}
.fig svg *{fill:none;stroke:#f6dc92;stroke-width:.9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dw 2.6s ease forwards}
@keyframes dw{to{stroke-dashoffset:0}}
.fig.pulse svg{animation:pu 8s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(.9)}50%{transform:scale(1.06)}}
.dtl h2{text-align:center;margin-top:8px}.tag{text-align:center;color:var(--cy);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.today{border:1px solid rgba(234,203,136,.5);background:rgba(234,203,136,.08);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:14px;color:var(--gold);display:flex;align-items:center;justify-content:space-between;gap:10px}
.today button{appearance:none;border:1px solid var(--line);background:none;color:var(--gold);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.med{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 40%,#10205a,#050816 75%);display:grid;place-items:center;text-align:center;padding:24px}
.med .fig{width:min(80vw,320px)}.med .bt{font:400 30px 'Instrument Serif',serif;color:#f3e2b8;margin-top:18px;min-height:38px}.med .tm{color:var(--mut);margin-top:4px}
.med .btn{max-width:260px;margin:22px auto 0}
.fig .fim{width:100%;height:100%;object-fit:cover;border-radius:20px;display:block;box-shadow:0 0 30px rgba(234,203,136,.4);animation:pop .8s ease}
.fig.big2{width:min(86%,340px)}
.fig .fim.rd{border-radius:50%}
</style></head><body><canvas id="bg"></canvas><main>
<div class="hero"><img src="https://cdn.jsdelivr.net/gh/HelonUniverse/hub@e3ad06a1e907f1d87409738ecc22d945c20a473f/dlr/tiles/geometria.webp" alt=""><div class="tt"><div class="eb">Contemplación</div><h1>Geometría <em>sagrada</em></h1><p class="lead">Formas para mirar con calma.</p></div></div>
<div class="today"><span id="tdt">Tu forma de hoy</span><button id="tdb">Verla</button></div>
<div class="card"><h2>Elige una forma</h2><div class="sub2" style="text-align:left">Toca una para verla dibujarse y leer qué representa.</div><div class="fgrid" id="fg"></div></div>
<div class="card dtl" id="dt" hidden><div class="fig big2" id="fi"></div><h2 id="nm"></h2><div class="tag" id="tg"></div><p class="tx" id="ds"></p><p class="tx" id="ob" style="color:var(--mut)"></p><div class="pr" id="hy"></div><div class="row2"><button class="btn" id="cm">Contemplar 1 minuto</button></div><div id="gd"></div></div>
<p class="note">Las formas son un símbolo para contemplar y reflexionar. Los significados son tradicionales y simbólicos, no científicos.</p>
</main>
<div class="med" id="med" hidden><div><div class="fig pulse" id="mf"></div><div class="bt" id="mb"></div><div class="tm" id="mt"></div><button class="btn ghost" id="mx">Terminar</button></div></div>
<script>
const $=i=>document.getElementById(i);
function guardar(btn,texto){if(window.parent===window){btn.textContent='Ábrelo desde la app para guardar';return}parent.postMessage({dlr:'diario',texto:String(texto).slice(0,1800)},location.origin);btn.textContent='✓ Guardado en tu diario';btn.disabled=true}
function gbtn(texto){const b=document.createElement('button');b.className='btn ghost';b.textContent='♡ Guardar en mi diario';b.onclick=()=>guardar(b,texto);return b}
const P='pathLength="1"';
function circ(cx,cy,r,dl){return '<circle '+P+' cx="'+cx+'" cy="'+cy+'" r="'+r+'" style="animation-delay:'+dl+'s"/>'}
function poly(n,r,rot,dl,cx,cy){cx=cx||50;cy=cy||50;let p=[];for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(2)+','+(cy+r*Math.sin(a)).toFixed(2))}return '<polygon '+P+' points="'+p.join(' ')+'" style="animation-delay:'+dl+'s"/>'}
function star(n,k,r,rot,dl){let p=[];for(let i=0;i<n;i++){const a=rot+((i*k)%n)*2*Math.PI/n;p.push((50+r*Math.cos(a)).toFixed(2)+','+(50+r*Math.sin(a)).toFixed(2))}return '<polygon '+P+' points="'+p.join(' ')+'" style="animation-delay:'+dl+'s"/>'}
function spiral(){const f=(1+Math.sqrt(5))/2;let pts=[];for(let t=0;t<=3.1*Math.PI;t+=.06){const r=2.1*Math.pow(f,2*t/Math.PI);pts.push((38+r*Math.cos(t+3.6)).toFixed(2)+' '+(58+r*Math.sin(t+3.6)).toFixed(2))}
 return '<polyline '+P+' points="'+pts.join(' ')+'" style="animation-duration:3.6s"/>'}
function flower(){const r=14;let s='';const cs=[];for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){if(Math.max(Math.abs(i),Math.abs(j),Math.abs(i+j))<=2)cs.push([50+r*(i+j/2),50+r*j*Math.sqrt(3)/2])}
 cs.forEach((c,n)=>{const d=Math.hypot(c[0]-50,c[1]-50);s+=circ(c[0].toFixed(2),c[1].toFixed(2),r,(d/r*.45).toFixed(2))});return s+circ(50,50,r*3,1.6)}
const F=[
{n:'Línea',t:'Conexión',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@0038e5559788a1fa45e1fcc08ed35c8770480f70/dlr/tiles/geo-linea.webp',g:()=>'<line pathLength="1" x1="12" y1="50" x2="88" y2="50"/>'+circ(12,50,2.2,.2)+circ(88,50,2.2,.9)+circ(50,50,1.6,1.4),d:'Es el camino más corto entre dos puntos y el primer movimiento: de un punto a otro nace la dirección. Habla de conexión, de un rumbo y de lo que une dos cosas.',o:'Sigue la línea de un extremo al otro y vuelve al centro.',h:'Piensa en un puente que quieras tender hoy con alguien o con una meta.'},
{n:'Círculo',t:'Unidad',rd:1,im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@21b48d9283b6d63ae44f7ba43691c8e5eab9ce8d/dlr/tiles/geo-circulo.webp',g:()=>circ(50,50,40,0)+circ(50,50,1.2,1.2),d:'No tiene principio ni fin. Todas las demás figuras nacen de él. Representa lo completo, el ciclo y el centro desde el que todo empieza.',o:'Sigue el borde con la mirada y vuelve al punto del centro.',h:'Escribe una cosa que hoy sientes completa en tu vida.'},
{n:'Dos círculos',t:'Encuentro',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@a3f7f7b87ad4f56ef764f8921742585a8f3e7580/dlr/tiles/geo-dos-circulos.webp',g:()=>circ(36,50,26,0)+circ(64,50,26,.9),d:'Cuando dos círculos se cruzan nace una forma nueva en el centro. Habla de lo que aparece cuando dos cosas se encuentran: dos personas, dos ideas, la razón y la emoción.',o:'Mira el espacio que comparten, en el centro.',h:'Piensa en una relación o decisión y busca qué tienen en común las dos partes.'},
{n:'Tres círculos',t:'Armonía',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@6c5ce111f448826f6d054150493ee5aebbf4fda3/dlr/tiles/geo-tres-circulos.webp',g:()=>circ(50,35,25,0)+circ(37.5,56.6,25,.7)+circ(62.5,56.6,25,1.4),d:'Tres círculos que se cruzan dejan una zona compartida en el centro, donde los tres se encuentran. Habla de lo que une a tres partes: cuerpo, mente y emoción, o pasado, presente y futuro.',o:'Busca el espacio donde coinciden los tres.',h:'Anota algo que hoy conecte tu cuerpo, tu mente y tu ánimo.'},
{n:'Triángulo',t:'Equilibrio',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@0bdc55909a6ce208db7a70b9b20ebc9f4302beb3/dlr/tiles/geo-triangulo.webp',g:()=>circ(50,50,40,0)+poly(3,40,-Math.PI/2,.8),d:'Tres puntos forman la figura más estable: tres lados, tres apoyos. Se asocia con cuerpo, mente y emoción en equilibrio, o con pasado, presente y futuro.',o:'Cuenta cada vértice y piensa en un apoyo de tu vida.',h:'Del 1 al 10, anota cómo estás hoy en cuerpo, mente y ánimo.'},
{n:'Cuadrado',t:'Base',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@92efd6bf5aa67648409f6243d9f1b1dd50aa2066/dlr/tiles/geo-cuadrado.webp',g:()=>poly(4,40,Math.PI/4,0)+circ(50,50,40*Math.SQRT1_2*Math.SQRT2,1),d:'Cuatro lados iguales y cuatro esquinas firmes. Es la forma de lo que se construye: el hogar, la rutina, la estructura que te sostiene.',o:'Fíjate en lo firme y parejo de cada lado.',h:'Elige una rutina pequeña que sostenga tu semana y empieza hoy.'},
{n:'Pentágono',t:'Crecimiento',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@e538b31080ffeab57e834f36cb7d61b47b10edb1/dlr/tiles/geo-pentagono.webp',g:()=>poly(5,40,-Math.PI/2,0)+star(5,2,40,-Math.PI/2,1),d:'Cinco lados y una estrella escondida en su interior donde aparece la proporción áurea. El número cinco se ve en flores, frutas cortadas y en tu propia mano. Se asocia con la vida que se desarrolla.',o:'Busca la estrella que se forma dentro.',h:'Corta una fruta o mira una flor y busca el número cinco.'},
{n:'Hexágono',t:'Orden',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@dd01ad8987cb8efccb736a144c69a034aa7a1c6c/dlr/tiles/geo-hexagono.webp',g:()=>poly(6,40,0,0)+star(6,1,40,0,.5)+'<path '+P+' d="M50 10V90M15.4 30L84.6 70M15.4 70L84.6 30" style="animation-delay:1s"/>',d:'Seis lados que encajan sin dejar huecos, como un panal. Muestra cómo la naturaleza reparte el espacio con el menor esfuerzo posible. Habla de armonía y orden.',o:'Mira cómo seis triángulos iguales llenan la figura.',h:'Ordena algo pequeño hoy: tu bolso, tu escritorio o tu agenda.'},
{n:'Heptágono',t:'Ciclos',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@f9679cfe439a73ce4587d2c68c81c25583ef38d9/dlr/tiles/geo-heptagono.webp',g:()=>circ(50,50,40,0)+poly(7,40,-Math.PI/2,.8),d:'Siete lados, la única figura sencilla que no se puede dibujar con exactitud con regla y compás. Se asocia con los ciclos de siete: los días de la semana, las fases de la luna, las notas de la escala. Habla de ritmo, de pausa y de completar una vuelta.',o:'Cuenta los siete vértices, uno por uno, como si fueran los días de tu semana.',h:'Elige un día de esta semana para hacer una pausa de verdad.'},
{n:'Eneágono',t:'Cierre',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@2ddf8e171b85b0c6c4424fa8dc4330f9613aeffd/dlr/tiles/geo-eneagono.webp',g:()=>circ(50,50,40,0)+poly(9,40,-Math.PI/2,.8),d:'Nueve lados: el último de los números simples, antes de que todo vuelva a empezar en el diez. Se asocia con el cierre de un ciclo, con la culminación y con soltar lo que ya cumplió su función para dar paso a lo nuevo.',o:'Recorre los nueve vértices y detente en el último, antes de volver al primero.',h:'Nombra algo que ya terminó en tu vida y agradécele lo que te dejó.'},
{n:'Dodecágono',t:'Ciclo del año',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@8fd8d483a27998fc28c08ff37aa590cdab906d58/dlr/tiles/geo-dodecagono.webp',g:()=>circ(50,50,40,0)+poly(12,40,-Math.PI/2,.8),d:'Doce lados, casi un círculo. Se asocia con el ciclo completo del año: doce meses, doce horas del reloj, doce signos del zodiaco. Habla de totalidad, de un ciclo recorrido entero y de cómo cada parte tiene su lugar.',o:'Recorre los doce vértices como si fueran los doce meses del año.',h:'Elige el mes de este año que más te enseñó y escribe por qué.'},
{n:'Espiral',t:'Movimiento',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@c794adefcd5a08a64f9cc6c7e7e3dadc1d6aecce/dlr/tiles/geo-espiral.webp',g:()=>spiral(),d:'Una línea que gira alrededor de un centro y se va abriendo. Está en las conchas, en los remolinos de agua y en las galaxias. Habla de un movimiento que avanza sin perder su origen.',o:'Empieza en el centro luminoso y sigue la curva con la mirada, una vuelta a la vez.',h:'Piensa en algo a lo que vuelves una y otra vez, pero cada vez distinto.'},
{n:'Espiral áurea',t:'Expansión',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@455292a9e484556eb42db23fc6f7c51428bb0885/dlr/tiles/geo-aurea.webp',g:()=>spiral(),d:'Cada vuelta crece en la misma proporción, la proporción áurea, que aparece en caracoles, helechos y galaxias. Habla de crecer sin dejar de ser tú.',o:'Sigue la espiral desde el centro hacia afuera, despacio.',h:'Piensa en una sola cosa en la que has crecido este año.'},
{n:'Semilla de la vida',t:'Origen',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@24f7e8621759cb8cb3ddbbe454abe1b3d659597a/dlr/tiles/geo-semilla.webp',g:()=>circ(50,50,18,0)+[0,1,2,3,4,5].map(i=>circ((50+18*Math.cos(i*Math.PI/3)).toFixed(2),(50+18*Math.sin(i*Math.PI/3)).toFixed(2),18,(.4+i*.25).toFixed(2))).join(''),d:'Siete círculos iguales: uno en el centro y seis a su alrededor, cada uno pasando por el centro de los demás. Es el primer paso de la Flor de la vida y representa un comienzo, la semilla de la que todo lo demás puede crecer.',o:'Mira el círculo del centro y cómo los seis lo abrazan formando una flor de seis pétalos.',h:'Escribe una idea pequeña que quieras sembrar esta semana.'},
{n:'Huevo de la vida',t:'Desarrollo',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@e49aedf235331afe4b9f3f5425202b78101b7a0d/dlr/tiles/geo-huevo.webp',g:()=>circ(50,50,13,0)+[0,1,2,3,4,5].map(i=>circ((50+26*Math.cos(i*Math.PI/3+Math.PI/6)).toFixed(2),(50+26*Math.sin(i*Math.PI/3+Math.PI/6)).toFixed(2),13,(.4+i*.25).toFixed(2))).join(''),d:'Siete esferas del mismo tamaño que se tocan: una en el centro y seis a su alrededor. Se parece a las primeras células de una vida que se divide y crece. Representa el desarrollo, el paso de la semilla a algo que empieza a tomar forma.',o:'Fíjate en cómo cada esfera sostiene a las demás sin quitarle espacio a ninguna.',h:'Piensa en una idea que ya sembraste y escribe su siguiente paso.'},
{n:'Flor de la vida',t:'Patrón que se repite',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@45164b10d03f1b1dcc22676617f958b7a034c57b/dlr/tiles/geo-flor.webp',g:()=>flower(),d:'Diecinueve círculos iguales que se cruzan formando un patrón que se repite. Es una de las figuras más usadas para contemplar, porque de ella salen las demás: círculos, triángulos, hexágonos.',o:'Mírala sin intentar entenderla.',h:'Contémplala un minuto sin hacer nada más.'},
{n:'Fruto de la vida',t:'Plano de todo',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@99bb3f0fa7cf7ab911bd1024d6e946bb576b60ba/dlr/tiles/geo-fruto.webp',g:()=>{let o=circ(50,50,9,0);[18,36].forEach((d,k)=>{for(let i=0;i<6;i++){const a=Math.PI/2+i*Math.PI/3;o+=circ((50+d*Math.cos(a)).toFixed(2),(50-d*Math.sin(a)).toFixed(2),9,(.3+k*.9+i*.12).toFixed(2))}});return o},d:'Trece círculos iguales: uno en el centro, seis a su alrededor y otros seis en el borde. Dentro de él se pueden trazar muchas de las formas que has visto aquí. Representa el patrón completo del que nacen las demás figuras.',o:'Busca el círculo del centro y cuenta los anillos que lo rodean, uno a uno.',h:'Piensa en una parte de tu vida que se compone de muchas piezas y nombra la que sostiene a las demás.'},
{n:'Árbol de la vida',t:'El camino completo',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@468b3781ceb27ab0e1aa2b21e0db8367b80f6a5e/dlr/tiles/geo-arbol.webp',g:()=>{const P=[[50,8],[26,24],[74,24],[26,46],[74,46],[50,55],[26,68],[74,68],[50,82],[50,95]];let o='';[[0,1],[0,2],[1,2],[1,3],[2,4],[3,4],[1,5],[2,5],[3,5],[4,5],[3,6],[4,7],[5,6],[5,7],[6,7],[6,8],[7,8],[5,8],[8,9]].forEach(([a,b],k)=>{o+='<line x1="'+P[a][0]+'" y1="'+P[a][1]+'" x2="'+P[b][0]+'" y2="'+P[b][1]+'" stroke="currentColor" stroke-width=".8" opacity=".7"/>'});P.forEach((q,i)=>{o+=circ(q[0],q[1],5,(i*.15).toFixed(2))});return o},d:'Diez esferas unidas por caminos, ordenadas en tres columnas. Es un mapa antiguo que muestra cómo la energía baja desde lo alto hasta lo concreto, y cómo se puede subir de nuevo.',o:'Recorre con la mirada de la esfera de arriba a la de abajo, siguiendo uno de los caminos.',h:'Elige una meta que tengas y nombra el primer paso concreto que la baja a la tierra.'},
{n:'Cubo de Metatrón',t:'Todas las formas',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@e4cbbb8ab17fcec23275b7ccb6b5aca84c668415/dlr/tiles/geo-metatron.webp',g:()=>{const P=[[50,50]];[18,36].forEach(d=>{for(let i=0;i<6;i++){const a=Math.PI/2+i*Math.PI/3;P.push([+(50+d*Math.cos(a)).toFixed(2),+(50-d*Math.sin(a)).toFixed(2)])}});let o='';for(let i=0;i<13;i++)for(let j=i+1;j<13;j++)o+='<line x1="'+P[i][0]+'" y1="'+P[i][1]+'" x2="'+P[j][0]+'" y2="'+P[j][1]+'" stroke="currentColor" stroke-width=".35" opacity=".45"/>';P.forEach((q,i)=>{o+=circ(q[0],q[1],5,(i*.1).toFixed(2))});return o},d:'Trece esferas, una al centro y las demás en dos anillos, unidas por líneas rectas. Al unirlas todas aparecen las formas básicas que viste antes: triángulos, cuadrados y hexágonos, escondidos unos dentro de otros.',o:'Busca un triángulo y un cuadrado dentro del dibujo. Cuando encuentres uno, busca otro igual.',h:'Piensa en algo que parece complicado en tu vida y busca la forma sencilla que hay debajo.'},
{n:'Toroide',t:'Flujo que vuelve',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@d7be6541e68b1c1a46e73a769fecae444ad164b0/dlr/tiles/geo-toroide.webp',g:()=>{let o='';for(let i=0;i<5;i++){o+='<ellipse cx="50" cy="50" rx="'+(44-i*5)+'" ry="'+(22-i*2)+'" fill="none" stroke="currentColor" stroke-width=".8" opacity=".7"/>'}o+='<ellipse cx="50" cy="50" rx="10" ry="4" fill="none" stroke="currentColor" stroke-width=".8"/>';return o},d:'Una forma como una rosquilla, donde lo que sale por un lado se curva y vuelve a entrar por el otro. Es la imagen de un flujo que se sostiene solo: da la vuelta, se renueva y no se agota.',o:'Sigue con la mirada una de las líneas doradas alrededor del anillo hasta volver al punto de partida.',h:'Piensa en algo que das y que, de una u otra forma, te regresa. Anótalo.'},
{n:'Triskel',t:'Tres en movimiento',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@95789f8f554fea3b6adb22b72d4d3a2502c41a15/dlr/tiles/geo-triskel.webp',g:()=>{let o='';for(let k=0;k<3;k++){let d='M50 50';for(let i=1;i<=24;i++){const t=i/24,a=(k*120-90)*Math.PI/180+t*3.6,r=t*26;d+=' L'+(50+r*Math.cos(a)).toFixed(2)+' '+(50+r*Math.sin(a)).toFixed(2)}o+='<path d="'+d+'" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>'}return o},d:'Tres espirales que salen de un mismo centro y giran en la misma dirección. Es un símbolo antiguo de las cosas que van de tres en tres y de un movimiento que nunca se detiene: pasado, presente y futuro, o cuerpo, mente y espíritu.',o:'Sigue una espiral con el dedo desde el centro hasta la punta y mira cómo las otras dos la acompañan.',h:'Piensa en tres áreas de tu vida que hoy están en movimiento y nombra cuál va más lenta.'},
{n:'Campo toroidal',t:'La energía que vuelve',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@bab54243a21da40af40e3e29e42b9a849a9d19de/dlr/tiles/geo-campo.webp',g:()=>{let o='<line x1="50" y1="4" x2="50" y2="96" stroke="currentColor" stroke-width="1"/>';for(let i=1;i<=6;i++){const r=i*6.5;o+='<ellipse cx="'+(50-r*.55).toFixed(1)+'" cy="50" rx="'+(r*.55).toFixed(1)+'" ry="'+(r*1.3).toFixed(1)+'" fill="none" stroke="currentColor" stroke-width=".8" opacity=".7"/><ellipse cx="'+(50+r*.55).toFixed(1)+'" cy="50" rx="'+(r*.55).toFixed(1)+'" ry="'+(r*1.3).toFixed(1)+'" fill="none" stroke="currentColor" stroke-width=".8" opacity=".7"/>'}return o},d:'Líneas que salen por un extremo, se curvan alrededor y regresan por el otro, formando un campo cerrado con un punto de calma en el centro. Es una forma que aparece en la naturaleza, desde un imán hasta el movimiento de una manzana o de un corazón.',o:'Mira el punto brillante del centro y sigue una línea hacia afuera hasta que vuelva.',h:'Piensa en qué te llena de energía y qué te la quita. ¿Cuál de las dos puedes cuidar hoy?'},
{n:'Merkaba',t:'Dos mundos en uno',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@244bdc2d7c06cf1ae9e4128379e8b57d992f2d3f/dlr/tiles/geo-merkaba.webp',g:()=>poly(3,40,-Math.PI/2,0)+poly(3,40,Math.PI/2,.4),d:'Dos triángulos que se cruzan, uno apuntando hacia arriba y otro hacia abajo, formando una estrella de seis puntas. En su versión en 3D son dos pirámides entrelazadas. Representa la unión de lo de arriba con lo de abajo, y de lo que das con lo que recibes.',o:'Fíjate en cómo un triángulo mira hacia arriba y el otro hacia abajo, y en el centro donde se encuentran.',h:'Piensa en dos partes tuyas que parecen opuestas, como dar y recibir, y busca cómo pueden convivir.'},
{n:'Tetraedro',t:'Firmeza',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@174312480b451376d7873d6051c4dcbb9e7a9808/dlr/tiles/geo-tetraedro.webp',g:()=>poly(3,40,-Math.PI/2,0)+'<line x1="50" y1="54" x2="50" y2="10" stroke="currentColor" stroke-width="1"/><line x1="50" y1="54" x2="15.4" y2="70" stroke="currentColor" stroke-width="1"/><line x1="50" y1="54" x2="84.6" y2="70" stroke="currentColor" stroke-width="1"/>',d:'Un sólido de cuatro caras triangulares, todas iguales. Es la forma tridimensional más simple y una de las más firmes: apoyada en cualquier cara, se sostiene. Se asocia con la energía y la voluntad.',o:'Cuenta las cuatro caras y fíjate en que, sea cual sea la que mires, todas son iguales.',h:'Piensa en qué te da firmeza hoy y qué necesitas para sostenerlo.'},
{n:'Cubo',t:'Estabilidad',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@2abfad72a6d2d7fee2b345cdfd5e6e26e5a2bc87/dlr/tiles/geo-cubo.webp',g:()=>'<rect x=\"22\" y=\"34\" width=\"48\" height=\"48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/><rect x=\"40\" y=\"18\" width=\"48\" height=\"48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" opacity=\".6\"/><line x1=\"22\" y1=\"34\" x2=\"40\" y2=\"18\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"70\" y1=\"34\" x2=\"88\" y2=\"18\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"22\" y1=\"82\" x2=\"40\" y2=\"66\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"70\" y1=\"82\" x2=\"88\" y2=\"66\" stroke=\"currentColor\" stroke-width=\"1\"/>',d:'Un sólido con seis caras cuadradas, doce aristas y ocho esquinas. Es la figura de la base y de la estabilidad: se apoya por completo y no se mueve. Representa lo que está firme y se puede construir encima.',o:'Cuenta las seis caras e imagina que giras el cubo: desde cualquier lado se ve igual de sólido.',h:'Piensa en qué base necesitas fortalecer hoy para poder construir lo siguiente.'},
{n:'Octaedro',t:'Equilibrio entre dos',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@6ab614e9bb21d76de4b35f43afd77f441d36584f/dlr/tiles/geo-octaedro.webp',g:()=>'<line x1=\"50\" y1=\"6\" x2=\"12\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"1.1\" opacity=\"1\"/><line x1=\"50\" y1=\"6\" x2=\"88\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"1.1\" opacity=\"1\"/><line x1=\"12\" y1=\"50\" x2=\"50\" y2=\"94\" stroke=\"currentColor\" stroke-width=\"1.1\" opacity=\"1\"/><line x1=\"88\" y1=\"50\" x2=\"50\" y2=\"94\" stroke=\"currentColor\" stroke-width=\"1.1\" opacity=\"1\"/><line x1=\"50\" y1=\"6\" x2=\"50\" y2=\"94\" stroke=\"currentColor\" stroke-width=\"1.1\" opacity=\".5\"/><line x1=\"12\" y1=\"50\" x2=\"88\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"1.1\" opacity=\".5\"/><line x1=\"50\" y1=\"6\" x2=\"62\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.1\" opacity=\".7\"/><line x1=\"12\" y1=\"50\" x2=\"62\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.1\" opacity=\".7\"/><line x1=\"88\" y1=\"50\" x2=\"62\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.1\" opacity=\".7\"/><line x1=\"50\" y1=\"94\" x2=\"62\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.1\" opacity=\".7\"/>',d:'Un sólido de ocho caras triangulares: dos pirámides unidas por la base. Tiene seis puntas, y cada una tiene su opuesta exacta. Habla del equilibrio entre lo de arriba y lo de abajo, lo de la izquierda y lo de la derecha.',o:'Busca las puntas de arriba y de abajo y la franja del medio donde las dos mitades se unen.',h:'Piensa en dos cosas de tu vida que necesitan equilibrarse hoy y cuál pide más atención.'},
{n:'Dodecaedro',t:'Visión del conjunto',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@d5679333f59969365691f911d1369bd9b09cf8e4/dlr/tiles/geo-dodecaedro.webp',g:()=>poly(5,16,-Math.PI/2,0)+poly(5,32,-Math.PI/2,.3)+poly(5,40,Math.PI/2,.6),d:'Un sólido de doce caras en forma de pentágono. Es el que más se parece a una esfera, por eso se asocia con el todo, con el cielo y con lo que lo contiene todo. Cada cara es una de las doce piezas de un conjunto completo.',o:'Busca el pentágono del centro y cuenta cuántos pentágonos lo rodean.',h:'Piensa en un tema que hoy te cuesta ver completo y mira una pieza más de la que sueles mirar.'},
{n:'Icosaedro',t:'Fluir',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@44de1339ae35c3cc165c812330ce65b2d78f6019/dlr/tiles/geo-icosaedro.webp',g:()=>poly(6,40,0,0)+poly(3,22,-Math.PI/2,.3)+poly(3,22,Math.PI/2,.6),d:'Un sólido de veinte caras triangulares, todas iguales. Es el que más se acerca a una gota de agua o a una esfera suave, y por eso se asocia con el fluir y con la adaptación. Muchos virus y estructuras naturales tienen esta forma.',o:'Cuenta cuántos triángulos se juntan en una sola punta. Son cinco, en cada una de las doce puntas.',h:'Piensa en dónde te cuesta fluir hoy y qué podrías soltar para moverte con más suavidad.'},
{n:'Estrella de cinco puntas',t:'Proporción áurea',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@88fb4ce8ce4f0d84e01296acc8baf0448123fefc/dlr/tiles/geo-pentagrama.webp',g:()=>circ(50,50,42,0)+star(5,2,42,-Math.PI/2,.3),d:'Una estrella que se dibuja con una sola línea que se cruza a sí misma, dentro de un círculo. Cada cruce divide la línea en la proporción áurea. El planeta Venus, visto desde la Tierra, dibuja esta misma forma en el cielo a lo largo de ocho años.',o:'Sigue con el dedo una de las líneas de punta a punta y mira cómo se cruza con las otras.',h:'Piensa en cinco cosas que hacen que tu vida funcione bien y cuál cuidas menos.'},
{n:'Estrella de seis puntas',t:'Dos triángulos, una forma',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@74853a358c869f1e52be3784d4f4fbe35848ef4b/dlr/tiles/geo-hexagrama.webp',g:()=>circ(50,50,42,0)+poly(3,38,-Math.PI/2,.3)+poly(3,38,Math.PI/2,.6),d:'Dos triángulos iguales, uno hacia arriba y otro hacia abajo, que se cruzan y forman seis puntas y un hexágono en el centro. Dentro caben seis triángulos pequeños más. Muestra cómo dos formas opuestas, al unirse, crean una figura nueva y completa.',o:'Encuentra los dos triángulos grandes y luego el hexágono que queda en el centro.',h:'Piensa en dos cosas opuestas en ti, y en qué se forma cuando las dejas convivir.'},
{n:'Estrella de ocho puntas',t:'Dos cuadrados girados',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@03c9316a33e51584f6dfd0d50602af4c352c39ea/dlr/tiles/geo-octagrama.webp',g:()=>circ(50,50,42,0)+poly(4,36,Math.PI/4,.3)+poly(4,36,0,.6),d:'Dos cuadrados iguales, uno girado sobre el otro, que forman ocho puntas y un octágono en el centro. Une la solidez del cuadrado con el movimiento del giro. Aparece en mosaicos y ventanas de muchas culturas.',o:'Encuentra los dos cuadrados y cuenta las ocho puntas que se forman.',h:'Piensa en algo firme en tu vida que hoy pide girar un poco, cambiar de ángulo.'},
{n:'Triquetra',t:'Tres que se enlazan',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@bf31d123918a226347ec475e20a2964620945a76/dlr/tiles/geo-triquetra.webp',g:()=>circ(50,32,24,0)+circ(34,60,24,.3)+circ(66,60,24,.6)+circ(50,50,42,.9),d:'Un nudo de tres lazos en forma de hoja, entrelazados sin principio ni final, dentro de un círculo. Cada lazo pasa por encima y por debajo de los otros dos. Habla de tres partes que dependen unas de otras y forman una sola cosa.',o:'Elige un lazo y síguelo con la mirada para ver cómo pasa por encima y por debajo de los demás.',h:'Piensa en tres partes de ti que se sostienen entre sí, como cuerpo, mente y emociones, y en cuál necesita más cuidado.'},
{n:'Infinito',t:'Sin principio ni final',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@826c33829365aeeb6299c1c6fda476a5e9616d99/dlr/tiles/geo-infinito.webp',g:()=>{let d='';for(let i=0;i<=60;i++){const t=i/60*2*Math.PI,c=Math.cos(t),sn=Math.sin(t),k=1+sn*sn;d+=(i?' L':'M')+(50+40*c/k).toFixed(2)+' '+(50+40*c*sn/k).toFixed(2)}return '<path '+P+' d="'+d+'Z" style="animation-delay:0s"/>'},d:'Una línea que se cruza en el centro y forma dos lazos iguales, sin principio ni final. Su nombre en geometría es lemniscata. Muestra un camino que va de un lado al otro y vuelve, siempre pasando por el centro.',o:'Sigue la línea con el dedo, pasando una y otra vez por el cruce del centro, sin levantarlo.',h:'Piensa en dos cosas entre las que vas y vienes cada día, y en qué hay en el punto donde se cruzan.'},
{n:'Mandala de pétalos',t:'Orden alrededor del centro',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@697a6dd255cc3098d1501f79bebf37531ed599c0/dlr/tiles/geo-mandala.webp',g:()=>{let o=circ(50,50,43,0);for(let i=0;i<12;i++){const a=i*30;o+='<ellipse '+P+' cx="50" cy="27" rx="7" ry="20" transform="rotate('+a+' 50 50)" style="animation-delay:'+(i*.08).toFixed(2)+'s"/>'}return o+circ(50,50,4,1)},d:'Doce pétalos iguales que salen de un punto central y se repiten alrededor, dentro de un círculo. La palabra mandala significa círculo, y se usa en muchas culturas para ordenar la atención: todo se repite y todo vuelve al centro.',o:'Empieza en la piedra del centro y recorre los pétalos uno a uno, dando una vuelta completa.',h:'Piensa en el centro de tu día de hoy, lo que no negocias, y en lo que gira a su alrededor.'},
{n:'Esfera',t:'Totalidad',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@ccd20962f1fb6210d70ac2db4484c9f6bdbb46c9/dlr/tiles/geo-esfera.webp',g:()=>{let o=circ(50,50,42,0);[14,28].forEach((rx,k)=>{o+='<ellipse '+P+' cx="50" cy="50" rx="'+rx+'" ry="42" style="animation-delay:'+(.3+k*.3)+'s"/>'});[14,28].forEach((ry,k)=>{o+='<ellipse '+P+' cx="50" cy="'+(50-(k?27:36))+'" rx="'+(k?34:24)+'" ry="'+(k?5:3)+'" style="animation-delay:'+(.9+k*.3)+'s"/>'});o+='<ellipse '+P+' cx="50" cy="50" rx="42" ry="7" style="animation-delay:1.5s"/>';return o},d:'Una forma redonda en todas las direcciones, donde todos los puntos de la superficie están a la misma distancia del centro. No tiene esquinas ni bordes, y por eso se asocia con la totalidad. Las líneas que la rodean, como los meridianos y el ecuador de la Tierra, ayudan a ubicarse en ella.',o:'Mira el ecuador, la banda ancha del medio, y luego los meridianos que suben y bajan hasta los dos polos.',h:'Piensa en algo de tu vida que hoy se ve en partes, y trata de mirarlo completo, como una sola esfera.'},
{n:'Laberinto',t:'Un solo camino',im:'https://cdn.jsdelivr.net/gh/HelonUniverse/hub@c64b70a51aa34e778601933d6e31b08ea06aba66/dlr/tiles/geo-laberinto.webp',g:()=>{let o=circ(50,50,43,0);for(let i=0;i<5;i++){const r=36-i*6.5;o+='<path '+P+' d="M'+(50-r)+' 70 A'+r+' '+r+' 0 1 1 '+(50+r)+' 70" style="animation-delay:'+(.3+i*.2).toFixed(1)+'s"/>'}return o+circ(50,50,3,1.4)},d:'Un dibujo con un único camino que da vueltas y vueltas hasta llegar al centro, y luego regresa por el mismo lugar. A diferencia de un laberinto con trampas, aquí no hay confusión ni callejones sin salida: solo hay que seguir avanzando. Se camina para calmar la mente.',o:'Sigue el camino con la mirada desde la entrada de abajo hasta la piedra del centro, sin saltarte ninguna vuelta.',h:'Piensa en algo que te toca recorrer despacio, vuelta por vuelta, sin buscar atajos.'}];

const fig=i=>F[i].im?'<img src="'+F[i].im+'" alt="'+F[i].n+'" class="fim'+(F[i].rd?' rd':'')+'">':svg(i);
let cur=-1;
F.forEach((f,i)=>{const b=document.createElement('button');b.className='fb';b.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true" style="stroke:#f3dda0;fill:none;stroke-width:2.2">'+f.g().replace(/style="[^"]*"/g,'').replace(/pathLength="1"/g,'')+'</svg><span>'+f.n+'</span>';b.onclick=()=>show(i);$('fg').append(b)});
function show(i){cur=i;[...$('fg').children].forEach((b,j)=>b.classList.toggle('on',j===i));const f=F[i];$('dt').hidden=false;$('fi').innerHTML=fig(i);$('nm').textContent=f.n;$('tg').textContent=f.t;$('ds').textContent=f.d;$('ob').textContent='Qué observar: '+f.o;$('hy').textContent='Para hoy: '+f.h;$('gd').textContent='';$('gd').append(gbtn('Geometría sagrada · '+f.n+' ('+f.t+'). '+f.d+' Para hoy: '+f.h));$('dt').scrollIntoView({behavior:'smooth',block:'start'})}
const n0=new Date(),di=(n0.getFullYear()*372+n0.getMonth()*31+n0.getDate())%F.length;
$('tdt').textContent='Tu forma de hoy: '+F[di].n;$('tdb').onclick=()=>show(di);
let tm=null;
$('cm').onclick=()=>{$('mf').innerHTML=fig(cur);$('med').hidden=false;let s=60,ph=0;const bt=['Inhala…','Exhala…'];$('mb').textContent=bt[0];$('mt').textContent=s+' s';clearInterval(tm);tm=setInterval(()=>{s--;if(s%4===0){ph=1-ph;$('mb').textContent=bt[ph]}$('mt').textContent=s+' s';if(s<=0){clearInterval(tm);$('mb').textContent='Gracias por detenerte.';$('mt').textContent='';$('mx').textContent='Volver'}},1000)};
$('mx').onclick=()=>{clearInterval(tm);$('med').hidden=true;$('mx').textContent='Terminar'};
(function(){const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,d,S=[],raf,last=0;const R=matchMedia('(prefers-reduced-motion: reduce)');
function rs(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);const n=Math.min(70,Math.max(24,W*H/16000|0));S=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.14,vy:(Math.random()-.5)*.14,r:.6+Math.random()*1,p:Math.random()*6.28}));dr(0)}
function dr(t){x.clearRect(0,0,W,H);const D=Math.min(140,Math.max(90,W*.17));for(let i=0;i<S.length;i++){const a=S[i];if(!R.matches){a.x=(a.x+a.vx+W)%W;a.y=(a.y+a.vy+H)%H}for(let j=i+1;j<S.length;j++){const b=S[j],q=Math.hypot(a.x-b.x,a.y-b.y);if(q<D){x.strokeStyle='rgba(234,203,136,'+(.2*(1-q/D)).toFixed(3)+')';x.lineWidth=.6;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}x.fillStyle='rgba(255,236,190,'+(.4+.25*Math.sin(t*.0007+a.p)).toFixed(3)+')';x.beginPath();x.arc(a.x,a.y,a.r,0,6.283);x.fill()}}
function f(t){if(t-last>30){dr(t);last=t}raf=requestAnimationFrame(f)}
addEventListener('resize',rs,{passive:true});rs();if(!R.matches)raf=requestAnimationFrame(f)})();

</script></body></html>
